<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Mon Activité">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
      -webkit-overflow-scrolling: touch;
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.08) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent); font-style: italic; }

    .back-btn {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(184, 134, 11, 0.08); }
    .back-btn i { font-size: clamp(14px, 1.8vw, 18px); }

    .header-placeholder {
      width: clamp(32px, 4vw, 40px);
      flex-shrink: 0;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 5% 40px;
      width: 100%;
      overflow-x: hidden;
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      animation: skeletonPulse 1.2s ease-in-out infinite;
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .skeleton-text { height: 14px; width: 100%; margin-bottom: 6px; border-radius: 4px; }
    .skeleton-text.w60 { width: 60%; }
    .skeleton-text.w40 { width: 40%; }
    .skeleton-text.w30 { width: 30%; }
    .skeleton-value { height: 32px; width: 70%; border-radius: 8px; }

    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: var(--radius);
      padding: clamp(16px, 3vw, 24px);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
      width: 100%;
      overflow: hidden;
    }
    .card:hover { border-color: rgba(184, 134, 11, 0.08); }

    /* ===== PAGE HEADER ===== */
    .page-header {
      margin-bottom: 20px;
    }
    .page-header .subtitle {
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .page-header h1 {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-light);
    }
    .page-header h1 span { color: var(--accent); font-style: italic; }
    .page-header p {
      color: var(--text-dim);
      font-size: clamp(12px, 1.2vw, 14px);
      margin-top: 4px;
    }

    /* ===== STATS CARDS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .stat-item {
      background: rgba(10, 10, 10, 0.4);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid rgba(184, 134, 11, 0.04);
      transition: border-color 0.2s;
    }
    .stat-item:hover { border-color: rgba(184, 134, 11, 0.06); }
    .stat-item .stat-icon {
      font-size: clamp(18px, 2vw, 24px);
      margin-bottom: 2px;
    }
    .stat-item .stat-icon.gold { color: var(--accent); }
    .stat-item .stat-icon.green { color: var(--success); }
    .stat-item .stat-icon.blue { color: #4A7A6A; }
    .stat-item .stat-icon.purple { color: #8A6A7A; }
    .stat-item .stat-icon.red { color: var(--danger); }

    .stat-item .stat-value {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(14px, 1.6vw, 18px);
      font-weight: 700;
      color: var(--text-light);
    }
    .stat-item .stat-label {
      font-size: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ===== FILTERS ===== */
    .filter-section {
      margin-bottom: 14px;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .filter-tab {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(184, 134, 11, 0.06);
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .filter-tab:active { transform: scale(0.96); }
    .filter-tab.active {
      background: rgba(184, 134, 11, 0.08);
      border-color: rgba(184, 134, 11, 0.15);
      color: var(--accent);
    }
    .filter-tab:hover:not(.active) {
      border-color: rgba(184, 134, 11, 0.1);
      color: var(--text-light);
    }
    .filter-tab i { margin-right: 4px; font-size: 10px; }

    .tx-count {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    /* ===== TRANSACTION ITEM ===== */
    .transaction-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .transaction-item:last-child { border-bottom: none; }

    .transaction-item .tx-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .transaction-item .tx-icon.depot { background: rgba(45, 125, 90, 0.12); color: var(--success); }
    .transaction-item .tx-icon.retrait { background: rgba(138, 58, 58, 0.12); color: var(--danger); }
    .transaction-item .tx-icon.achat { background: rgba(184, 134, 11, 0.12); color: var(--accent); }
    .transaction-item .tx-icon.vente { background: rgba(26, 58, 42, 0.2); color: #4A7A6A; }
    .transaction-item .tx-icon.gain { background: rgba(45, 125, 90, 0.08); color: var(--success); }
    .transaction-item .tx-icon.parrainage { background: rgba(184, 134, 11, 0.10); color: var(--accent); }
    .transaction-item .tx-icon.defi { background: rgba(99, 102, 241, 0.10); color: #6366F1; }
    .transaction-item .tx-icon.forum_likes { background: rgba(255, 71, 87, 0.10); color: #FF4757; }

    .transaction-item .tx-content { flex: 1; min-width: 0; }
    .transaction-item .tx-content .tx-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
    }
    .transaction-item .tx-content .tx-desc {
      font-size: 11px;
      color: var(--text-muted);
    }
    .transaction-item .tx-amount {
      font-weight: 600;
      font-size: 14px;
      text-align: right;
      flex-shrink: 0;
    }
    .transaction-item .tx-amount.positive { color: var(--success); }
    .transaction-item .tx-amount.negative { color: var(--danger); }

    .transaction-item .tx-status {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
      margin-top: 2px;
    }
    .transaction-item .tx-status.valide { background: rgba(45, 125, 90, 0.12); color: var(--success); }
    .transaction-item .tx-status.en_attente { background: rgba(184, 134, 11, 0.12); color: var(--accent); }
    .transaction-item .tx-status.rejete { background: rgba(138, 58, 58, 0.12); color: var(--danger); }

    .tx-empty {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
    }
    .tx-empty i {
      font-size: 32px;
      opacity: 0.3;
      margin-bottom: 10px;
      display: block;
    }

    /* ===== CHART ===== */
    .chart-container {
      width: 100%;
      padding: 6px 0;
    }
    .chart-container canvas {
      width: 100% !important;
      height: auto !important;
      max-height: 160px;
      background: rgba(10,10,10,0.3);
      border-radius: 8px;
    }
    .chart-empty {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .chart-empty i {
      font-size: 28px;
      opacity: 0.3;
      display: block;
      margin-bottom: 6px;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #0D2A1F; border: 1px solid #2D7D5A; color: #2D7D5A; }
    .toast.error { background: #2A0D0D; border: 1px solid #8A3A3A; color: #8A3A3A; }
    .toast.warning { background: #2A1A0D; border: 1px solid #B8860B; color: #B8860B; }
    .toast.info { background: #0D1A2A; border: 1px solid #4A7A8A; color: #4A7A8A; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .stat-item { padding: 10px 6px; }
      .stat-item .stat-value { font-size: 14px; }
      .container { padding: 12px 4%; }
      .card { padding: 14px; }
      .filter-tab { font-size: 9px; padding: 4px 10px; }
    }

    @media (min-width: 601px) and (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (min-width: 1025px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    }
  </style>
</head>

<header class="header">

  <a href="index.html" class="logo">ARVE<span>XA</span></a>
  <span class="header-placeholder"></span>
</header>

<main class="container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="subtitle"><i class="fas fa-chart-pie"></i> Tableau de bord</div>
    <h1>📊 Mon <span>Activité</span></h1>
    <p>Suivez vos performances et revenus en temps réel</p>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-icon gold"><i class="fas fa-coins"></i></div>
      <div class="stat-value" id="statBalance">
        <span class="skeleton skeleton-value" style="width:60%;margin:0 auto;"></span>
      </div>
      <div class="stat-label">Solde</div>
    </div>
    <div class="stat-item">
      <div class="stat-icon green"><i class="fas fa-arrow-up"></i></div>
      <div class="stat-value" id="statRevenus">
        <span class="skeleton skeleton-value" style="width:60%;margin:0 auto;"></span>
      </div>
      <div class="stat-label">Revenus</div>
    </div>
    <div class="stat-item">
      <div class="stat-icon blue"><i class="fas fa-trophy"></i></div>
      <div class="stat-value" id="statDefis">
        <span class="skeleton skeleton-value" style="width:60%;margin:0 auto;"></span>
      </div>
      <div class="stat-label">Défis</div>
    </div>
    <div class="stat-item">
      <div class="stat-icon gold"><i class="fas fa-users"></i></div>
      <div class="stat-value" id="statParrainages">
        <span class="skeleton skeleton-value" style="width:60%;margin:0 auto;"></span>
      </div>
      <div class="stat-label">Parrainages</div>
    </div>
  </div>

  <!-- CHART -->
  <div class="card">
    <div class="card-title" style="font-family:'Playfair Display','Georgia',serif;font-size:clamp(16px,1.8vw,19px);font-weight:700;color:var(--text-light);margin-bottom:12px;">
      📊 Évolution des <span style="color:var(--accent);font-style:italic;">gains</span>
    </div>
    <div class="chart-container">
      <canvas id="gainChart" height="160"></canvas>
    </div>
  </div>

  <!-- BREAKDOWN -->
  <div class="card">
    <div class="card-title" style="font-family:'Playfair Display','Georgia',serif;font-size:clamp(16px,1.8vw,19px);font-weight:700;color:var(--text-light);margin-bottom:12px;">
      📊 Répartition des <span style="color:var(--accent);font-style:italic;">revenus</span>
    </div>
    <div id="breakdownContainer" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
      <div class="skeleton skeleton-text w60"></div>
      <div class="skeleton skeleton-text w40"></div>
      <div class="skeleton skeleton-text w50"></div>
      <div class="skeleton skeleton-text w30"></div>
    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div class="card">
    <div class="card-title" style="font-family:'Playfair Display','Georgia',serif;font-size:clamp(16px,1.8vw,19px);font-weight:700;color:var(--text-light);margin-bottom:12px;">
      📋 Historique des <span style="color:var(--accent);font-style:italic;">activités</span>
    </div>

    <!-- FILTRES TYPE -->
    <div class="filter-section">
      <div class="filter-tabs" id="typeFilters">
        <button class="filter-tab active" data-filter="all"><i class="fas fa-list"></i> Tout</button>
        <button class="filter-tab" data-filter="revenu"><i class="fas fa-arrow-up"></i> Revenus</button>
        <button class="filter-tab" data-filter="depot"><i class="fas fa-arrow-down"></i> Dépôts</button>
        <button class="filter-tab" data-filter="retrait"><i class="fas fa-arrow-up"></i> Retraits</button>
        <button class="filter-tab" data-filter="achat"><i class="fas fa-shopping-cart"></i> Achats</button>
      </div>
    </div>

    <!-- FILTRES PÉRIODE -->
    <div class="filter-section">
      <div class="filter-tabs" id="periodFilters">
        <button class="filter-tab" data-period="week">📆 Semaine</button>
        <button class="filter-tab" data-period="month">📆 Mois</button>
        <button class="filter-tab" data-period="year">📆 Année</button>
        <button class="filter-tab active" data-period="all">📆 Tout</button>
      </div>
    </div>

    <span class="tx-count" id="txCount">0 activité(s)</span>

    <div id="transactionsList">
      <div class="tx-empty">
        <i class="fas fa-clock"></i>
        <p>Aucune activité</p>
      </div>
    </div>
  </div>

</main>

function getCachedUserData() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    const timestamp = localStorage.getItem('ARVEXA_user_data_timestamp');
    if (!cached) return null;
    if (timestamp) {

    }
    return JSON.parse(cached);
  } catch(e) { return null; }
}

function setCachedUserData(data) {
  localStorage.setItem('ARVEXA_user_data', JSON.stringify(data));
  localStorage.setItem('ARVEXA_user_data_timestamp', String(Date.now()));
}

function loadFromCache() {
  const cached = getCachedUserData();
  if (cached) {
    userData = cached;
    updateStats(cached);
    console.debug('✅ Activité: données chargées depuis le cache');
    return true;
  }
  return false;
}

// ================================================================

function showToast(message, type) {
  type = type || 'info';
  toast.textContent = message;
  toast.className = 'toast ' + type;
  clearTimeout(notificationTimeout);
  requestAnimationFrame(function() {
    toast.classList.add('show');
  });

    toast.classList.remove('show');
  }, 3500);
}

// ================================================================
// FORMATS
// ================================================================
function formatCurrency(amount) {
  if (!amount) return '0 FCFA';
  if (amount >= 1000000) return (amount / 1000000).toFixed(1) + 'M FCFA';
  if (amount >= 1000) return (amount / 1000).toFixed(1) + 'K FCFA';
  return amount.toLocaleString('fr-FR') + ' FCFA';
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  try {
    var d = new Date(dateStr);
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    return dateStr;
  }
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getTypeIcon(type) {
  const icons = {
    'depot': { icon: 'fa-arrow-down', cls: 'depot' },
    'retrait': { icon: 'fa-arrow-up', cls: 'retrait' },
    'achat': { icon: 'fa-shopping-cart', cls: 'achat' },
    'vente': { icon: 'fa-hand-holding-usd', cls: 'vente' },
    'gain': { icon: 'fa-coins', cls: 'gain' },
    'parrainage': { icon: 'fa-users', cls: 'parrainage' },
    'defi': { icon: 'fa-trophy', cls: 'defi' },
    'forum_likes': { icon: 'fa-heart', cls: 'forum_likes' }
  };
  return icons[type] || { icon: 'fa-exchange-alt', cls: '' };
}

function getTypeLabel(type) {
  const labels = {
    'depot': 'Dépôt',
    'retrait': 'Retrait',
    'achat': 'Achat',
    'vente': 'Vente',
    'gain': 'Gain',
    'parrainage': 'Parrainage',
    'defi': 'Défi gagné',
    'forum_likes': 'Likes forum'
  };
  return labels[type] || type;
}

// ================================================================
// UPDATE STATS
// ================================================================
function updateStats(data) {
  if (!data) return;
  
  var balance = data.balance || 0;
  var gainsTotal = data.gainsTotal || 0;
  var totalDefis = data.totalDefisGagnes || 0;
  var referralsCount = data.referralsCount || 0;
  
  statBalance.textContent = formatCurrency(balance);
  statRevenus.textContent = formatCurrency(gainsTotal);
  statDefis.textContent = formatCurrency(totalDefis);
  statParrainages.textContent = referralsCount || 0;
}

// ================================================================
// DRAW CHART
// ================================================================
function drawChart(gains) {
  var ctx = canvas.getContext('2d');
  var width = canvas.width = canvas.parentElement.clientWidth || 400;
  var height = canvas.height = 160;
  
  ctx.clearRect(0, 0, width, height);

  if (!gains || gains.length === 0 || gains.every(v => v === 0)) {
    ctx.fillStyle = '#5A5A4A';
    ctx.font = '13px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Aucune donnée disponible', width/2, height/2);
    return;
  }

  var max = Math.max.apply(null, gains) || 1;
  var padding = { top: 20, bottom: 25, left: 30, right: 20 };
  var chartWidth = width - padding.left - padding.right;
  var chartHeight = height - padding.top - padding.bottom;
  var barWidth = Math.min(chartWidth / gains.length * 0.5, 30);
  var gap = chartWidth / gains.length;

  var colors = ['#B8860B', '#2D7D5A', '#4A7A6A', '#8A6A7A', '#D4A017', '#6366F1'];

  gains.forEach(function(value, index) {
    var x = padding.left + (index * gap) + (gap - barWidth) / 2;
    var barHeight = (value / max) * chartHeight;
    var y = padding.top + chartHeight - barHeight;

    ctx.fillStyle = colors[index % colors.length];
    ctx.beginPath();
    ctx.roundRect(x, y, barWidth, barHeight, 3);
    ctx.fill();

    ctx.fillStyle = '#F5F0E8';
    ctx.font = '9px Inter, sans-serif';
    ctx.textAlign = 'center';
    var displayVal = value >= 1000 ? (value/1000).toFixed(1) + 'K' : value;
    ctx.fillText(displayVal, x + barWidth/2, y - 4);
  });

  ctx.fillStyle = '#5A5A4A';
  ctx.font = '9px Inter, sans-serif';
  ctx.textAlign = 'center';
  var labels = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'];
  gains.forEach(function(_, index) {
    var x = padding.left + (index * gap) + gap/2;
    ctx.fillText(labels[index] || '', x, height - 4);
  });
}

// ================================================================
// RENDER BREAKDOWN
// ================================================================
function renderBreakdown(activities) {
  var gains = activities.filter(a => a.type === 'gain' || a.type === 'parrainage' || a.type === 'defi' || a.type === 'forum_likes' || a.type === 'vente');
  
  var breakdown = {
    parrainage: 0,
    defi: 0,
    vente: 0,
    forum_likes: 0
  };
  
  gains.forEach(a => {
    if (a.type === 'parrainage') breakdown.parrainage += a.montant || 0;
    else if (a.type === 'defi') breakdown.defi += a.montant || 0;
    else if (a.type === 'vente') breakdown.vente += a.montant || 0;
    else if (a.type === 'forum_likes') breakdown.forum_likes += a.montant || 0;
  });
  
  var total = breakdown.parrainage + breakdown.defi + breakdown.vente + breakdown.forum_likes;
  
  if (total === 0) {
    breakdownContainer.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">
        <i class="fas fa-chart-pie" style="font-size:24px;opacity:0.2;display:block;margin-bottom:8px;"></i>
        Aucun revenu pour le moment
      </div>
    `;
    return;
  }
  
  var items = [
    { label: '👥 Parrainage', value: breakdown.parrainage, color: 'var(--accent)' },
    { label: '🏆 Défis', value: breakdown.defi, color: '#6366F1' },
    { label: '🛒 Ventes', value: breakdown.vente, color: '#4A7A6A' },
    { label: '❤️ Likes forum', value: breakdown.forum_likes, color: '#FF4757' }
  ].filter(i => i.value > 0);
  
  var html = '';
  items.forEach(function(item) {
    var percent = Math.round((item.value / total) * 100);
    html += `
      <div style="background:rgba(10,10,10,0.3);border-radius:10px;padding:10px 12px;border:1px solid rgba(184,134,11,0.04);">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--text-dim);">${item.label}</span>
          <span style="color:var(--text-light);font-weight:600;">${formatCurrency(item.value)}</span>
        </div>
        <div style="width:100%;height:4px;background:rgba(255,255,255,0.04);border-radius:4px;margin-top:4px;overflow:hidden;">
          <div style="width:${percent}%;height:100%;background:${item.color};border-radius:4px;transition:width 0.5s ease;"></div>
        </div>
        <div style="font-size:9px;color:var(--text-muted);margin-top:2px;text-align:right;">${percent}%</div>
      </div>
    `;
  });
  
  breakdownContainer.innerHTML = html;
}

// ================================================================
// RENDER TRANSACTIONS
// ================================================================
function renderTransactions() {
  var filtered = allActivities;
  
  // FILTRE PAR TYPE
  if (currentFilter !== 'all') {
    if (currentFilter === 'revenu') {
      filtered = filtered.filter(function(t) {
        return t.type === 'gain' || t.type === 'parrainage' || t.type === 'defi' || t.type === 'forum_likes' || t.type === 'vente';
      });
    } else {
      filtered = filtered.filter(function(t) {
        return t.type === currentFilter;
      });
    }
  }
  
  // FILTRE PAR PÉRIODE
  if (currentPeriod !== 'all') {
    var now = new Date();
    var cutoff = new Date(now);
    if (currentPeriod === 'week') cutoff.setDate(now.getDate() - 7);
    else if (currentPeriod === 'month') cutoff.setMonth(now.getMonth() - 1);
    else if (currentPeriod === 'year') cutoff.setFullYear(now.getFullYear() - 1);
    
    filtered = filtered.filter(function(t) {
      var date = new Date(t.timestamp || t.date || t.createdAt);
      return date >= cutoff;
    });
  }

  txCount.textContent = filtered.length + ' activité(s)';

  if (filtered.length === 0) {
    transactionsList.innerHTML = '<div class="tx-empty"><i class="fas fa-clock"></i><p>Aucune activité</p></div>';
    return;
  }

  // Trier par date décroissante
  filtered.sort(function(a, b) {
    var dateA = new Date(a.timestamp || a.date || a.createdAt);
    var dateB = new Date(b.timestamp || b.date || b.createdAt);
    return dateB - dateA;
  });

  var html = '';
  var display = filtered.slice(0, 50);

  display.forEach(function(t) {
    var isPositive = t.type === 'depot' || t.type === 'vente' || t.type === 'gain' || t.type === 'parrainage' || t.type === 'defi' || t.type === 'forum_likes';
    var isNegative = t.type === 'retrait' || t.type === 'achat';
    var amountClass = isPositive ? 'positive' : (isNegative ? 'negative' : '');
    var sign = isPositive ? '+' : (isNegative ? '-' : '');

    var typeMap = getTypeIcon(t.type);
    var icon = typeMap.icon;
    var iconClass = typeMap.cls;
    var label = getTypeLabel(t.type);

    var status = t.statut || t.status || 'en_attente';
    var statusClass = status === 'validé' || status === 'valide' || status === 'confirmed' ? 'valide' :
                     (status === 'rejeté' || status === 'rejete' || status === 'rejected' ? 'rejete' : 'en_attente');
    var statusText = statusClass === 'valide' ? '✅ Validé' :
                     (statusClass === 'rejete' ? '❌ Rejeté' : '⏳ En attente');

    var desc = t.description || t.productName || t.packName || t.sourceType || '';
    var montant = t.montant || t.amount || 0;
    var date = t.timestamp || t.date || t.createdAt || '';

    html += '<div class="transaction-item">';
    html += '<div class="tx-icon ' + iconClass + '"><i class="fas ' + icon + '"></i></div>';
    html += '<div class="tx-content">';
    html += '<div class="tx-title">' + label + (desc ? ' — ' + escapeHtml(desc) : '') + '</div>';
    html += '<div class="tx-desc">' + formatDate(date) + '</div>';
    html += '</div>';
    html += '<div style="text-align:right;">';
    html += '<div class="tx-amount ' + amountClass + '">' + sign + formatCurrency(montant) + '</div>';
    html += '<span class="tx-status ' + statusClass + '">' + statusText + '</span>';
    html += '</div>';
    html += '</div>';
  });

  transactionsList.innerHTML = html;
}

// ================================================================
// MISE À JOUR DU GRAPHIQUE
// ================================================================
function updateChart() {
  var gains = [];
  var now = new Date();
  for (var i = 5; i >= 0; i--) {
    var weekStart = new Date(now);
    weekStart.setDate(now.getDate() - (i * 7 + 6));
    var weekEnd = new Date(now);
    weekEnd.setDate(now.getDate() - (i * 7));
    
    var total = 0;
    allActivities.forEach(function(t) {
      var date = new Date(t.timestamp || t.date || t.createdAt);
      if (date >= weekStart && date <= weekEnd) {
        var isGain = t.type === 'gain' || t.type === 'parrainage' || t.type === 'defi' || t.type === 'forum_likes' || t.type === 'vente';
        if (isGain) {
          total += t.montant || t.amount || 0;
        }
      }
    });
    gains.push(total);
  }
  drawChart(gains);
}

// ================================================================
// CHARGER LES ACTIVITÉS EN TEMPS RÉEL
// ================================================================
function loadActivitiesRealtime(userId) {
  if (unsubscribeAll) {
    unsubscribeAll();
    unsubscribeAll = null;
  }
  
  allActivities = [];
  var collections = ['depots', 'retraits', 'achats', 'ventes', 'gains'];
  var collectionData = {};
  var loadingCount = collections.length;
  
  // Fonction pour ajouter une activité
  function addActivity(collectionName, docId, data) {
    var typeMap = {
      'depots': 'depot',
      'retraits': 'retrait',
      'achats': 'achat',
      'ventes': 'vente',
      'gains': 'gain'
    };
    
    // Déterminer le vrai type pour les gains
    var type = typeMap[collectionName] || 'transaction';
    if (collectionName === 'gains' && data.type) {
      type = data.type; // parrainage, defi, forum_likes, vente
    }
    
    allActivities.push({
      id: docId,
      collection: collectionName,
      ...data,
      type: type
    });
  }
  
  // Écouter chaque collection
  collections.forEach(function(collectionName) {
    var q = query(
      collection(db, collectionName),
      where('userId', '==', userId)
    );
    
    var unsub = onSnapshot(q, function(snapshot) {
      var updated = false;
      
      snapshot.docChanges().forEach(function(change) {
        var data = change.doc.data();
        
        if (change.type === 'added') {
          // Vérifier si déjà présent
          var exists = allActivities.some(function(a) { 
            return a.id === change.doc.id && a.collection === collectionName; 
          });
          if (!exists) {
            addActivity(collectionName, change.doc.id, data);
            updated = true;
          }
        } else if (change.type === 'modified') {
          var index = allActivities.findIndex(function(a) { 
            return a.id === change.doc.id && a.collection === collectionName; 
          });
          if (index !== -1) {
            allActivities[index] = { ...allActivities[index], ...data };
            updated = true;
          } else {
            addActivity(collectionName, change.doc.id, data);
            updated = true;
          }
        } else if (change.type === 'removed') {
          allActivities = allActivities.filter(function(a) { 
            return !(a.id === change.doc.id && a.collection === collectionName); 
          });
          updated = true;
        }
      });
      
      if (updated) {
        renderTransactions();
        updateChart();
        renderBreakdown(allActivities);
      }
      
      loadingCount--;
      if (loadingCount === 0) {
        dataLoaded = true;
      }
    }, function(error) {
      if (error.code !== 'aborted' && error.code !== 'cancelled') {
        console.error('Erreur écoute ' + collectionName + ':', error);
      }
      loadingCount--;
    });
    
    if (!collectionData[collectionName]) {
      collectionData[collectionName] = { unsub: unsub };
    }
  });
  
  // Stocker les unsubscribe
  window._unsubActivities = function() {
    Object.values(collectionData).forEach(function(item) {
      if (item.unsub) item.unsub();
    });
  };
}

// AUTH
// ================================================================
var authChecked = false;
var sessionUid = sessionStorage.getItem('session_uid');

// Chargement rapide depuis le cache
loadFromCache();

onAuthStateChanged(auth, function(user) {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);
    
    if (sessionUid === user.uid) {
      console.debug("✅ Session déjà validée, chargement rapide");
      loadUserData(user.uid).then(function() {
        loadActivitiesRealtime(user.uid);
      });
      isPageLoading = false;
      return;
    }

    loadUserData(user.uid).then(function() {
      loadActivitiesRealtime(user.uid);
    });
    isPageLoading = false;
  } else {
    if (isPageLoading) {
      setTimeout(function() {
        if (!auth.currentUser) {
          var savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          } else {
            window.location.href = 'login.html';
          }
        }
      }, 3000);
    } else {
      var savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(function() {
          if (!auth.currentUser) {
            window.location.href = 'login.html';
          }
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }
    }
    authChecked = true;
  }
});

// ================================================================
// CHARGER UTILISATEUR
// ================================================================
async function loadUserData(uid) {
  try {
    var userRef = doc(db, 'users', uid);
    var docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      userData = docSnap.data();
      updateStats(userData);
      setCachedUserData(userData);
      return userData;
    }
    return null;
  } catch (error) {
    console.error('Erreur chargement user:', error);
    return null;
  }
}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Défi du Lundi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* ===== STYLES UNIFORMES ARVEXA (comme la page principale) ===== */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.10) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent); font-style: italic; }

    .back-btn {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(184, 134, 11, 0.08); }
    .back-btn i { font-size: clamp(14px, 1.8vw, 18px); }

    .header-placeholder {
      width: clamp(32px, 4vw, 40px);
      flex-shrink: 0;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 5% 40px;
      width: 100%;
    }

    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: var(--radius);
      padding: clamp(16px, 3vw, 24px);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
      width: 100%;
      overflow: hidden;
    }

    /* ===== DEFI HEADER ===== */
    .defi-header {
      text-align: center;
      padding: 10px 0;
    }
    .defi-header .defi-day {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .defi-header .defi-title {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--text-light);
      margin: 4px 0;
    }
    .defi-header .defi-title span { color: var(--accent); font-style: italic; }
    .defi-header .defi-reward {
      font-size: 14px;
      color: var(--success);
      font-weight: 600;
    }

    /* ===== QUESTION ===== */
    .question-item {
      background: rgba(10, 10, 10, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .question-item .q-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    .question-item .q-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .question-item .q-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(10, 10, 10, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
      color: var(--text-dim);
    }
    .question-item .q-options label:active { transform: scale(0.98); }
    .question-item .q-options label:hover { border-color: rgba(184, 134, 11, 0.15); }
    .question-item .q-options input[type="radio"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .question-item .q-options label.selected {
      border-color: var(--accent);
      background: rgba(184, 134, 11, 0.06);
    }
    .question-item .q-options label.correct {
      border-color: var(--success);
      background: rgba(45, 125, 90, 0.06);
      color: var(--success);
    }
    .question-item .q-options label.wrong {
      border-color: var(--danger);
      background: rgba(138, 58, 58, 0.06);
      color: var(--danger);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: var(--bg-dark);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-submit .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--bg-dark);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #0D2A1F; border: 1px solid #2D7D5A; color: #2D7D5A; }
    .toast.error { background: #2A0D0D; border: 1px solid #8A3A3A; color: #8A3A3A; }
    .toast.warning { background: #2A1A0D; border: 1px solid #B8860B; color: #B8860B; }
    .toast.info { background: #0D1A2A; border: 1px solid #4A7A8A; color: #4A7A8A; }

    @media (max-width: 480px) {
      .container { padding: 12px 12px 30px; }
      .defi-header .defi-title { font-size: 18px; }
      .question-item { padding: 12px; }
      .question-item .q-text { font-size: 13px; }
    }

    @media (min-width: 768px) {
      .container { max-width: 700px; padding: 24px 24px 40px; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header class="header">
  <a href="epargne.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <a href="index.html" class="logo">ARVE<span>XA</span></a>
  <span class="header-placeholder"></span>
</header>

<main class="container">

  <div class="card">
    <div class="defi-header">
      <div class="defi-day">📅 Lundi</div>
      <h1 class="defi-title">Quiz <span>Culture Générale</span></h1>
      <div class="defi-reward">💰 +40 FCFA</div>
    </div>
  </div>

  <div class="card">
    <form id="quizForm">
      <div id="questionsContainer">
        <!-- Questions générées par JavaScript -->
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Valider mes réponses
      </button>
    </form>
  </div>

</main>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ================================================================ -->
<!-- CONFIGURATION CENTRALISÉE -->
<!-- ================================================================ -->
<script src="config.js"></script>

<!-- ================================================================ -->
<!-- IMPORTS -->
<!-- ================================================================ -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }
}
</script>

<script type="module">
// ================================================================
// IMPORTS
// ================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { 
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// ================================================================
// CONFIGURATION FIREBASE
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBEbYuuUlNCLMBUHClv4UnyownNHw2q3_g",
  authDomain: "nexgen-39043.firebaseapp.com",
  projectId: "nexgen-39043",
  storageBucket: "nexgen-39043.firebasestorage.app",
  messagingSenderId: "619390144325",
  appId: "1:619390144325:web:35d96b125501e4e8b1782c",
  measurementId: "G-HC2Q5DNKDR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

// ================================================================
// QUESTIONS DU LUNDI
// ================================================================
const QUESTIONS = [
  { question: "Quel est le plus grand océan du monde ?", options: ["Pacifique", "Atlantique", "Indien", "Arctique"], bonne: 0 },
  { question: "Combien y a-t-il de continents ?", options: ["5", "6", "7", "8"], bonne: 2 },
  { question: "Quelle est la capitale du Japon ?", options: ["Séoul", "Pékin", "Tokyo", "Bangkok"], bonne: 2 },
  { question: "Qui a peint la Joconde ?", options: ["Michel-Ange", "Léonard de Vinci", "Raphaël", "Donatello"], bonne: 1 },
  { question: "Quel est l'animal le plus rapide du monde ?", options: ["Lion", "Guépard", "Faucon", "Antilope"], bonne: 1 },
  { question: "Quelle est la plus haute montagne du monde ?", options: ["Mont Blanc", "Kilimandjaro", "Everest", "K2"], bonne: 2 },
  { question: "Dans quel pays se trouve la tour Eiffel ?", options: ["Italie", "Espagne", "France", "Allemagne"], bonne: 2 },
  { question: "Quelle est la planète la plus proche du soleil ?", options: ["Vénus", "Mercure", "Terre", "Mars"], bonne: 1 },
  { question: "Combien d'heures y a-t-il dans une journée ?", options: ["12", "24", "36", "48"], bonne: 1 },
  { question: "Quel est le symbole chimique de l'eau ?", options: ["H2O", "CO2", "NaCl", "HCl"], bonne: 0 }
];

// ================================================================
// DOM
// ================================================================
const questionsContainer = document.getElementById('questionsContainer');
const submitBtn = document.getElementById('submitBtn');
const quizForm = document.getElementById('quizForm');
const toast = document.getElementById('toast');

let currentUser = null;
let userData = null;
let userDefis = {};
let reponses = [];
let isPageLoading = true;
let notificationTimeout = null;
let isSubmitting = false;

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'info') {
  toast.textContent = message;
  toast.className = 'toast ' + type;
  clearTimeout(notificationTimeout);
  requestAnimationFrame(() => toast.classList.add('show'));
  notificationTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ================================================================
// GESTION DU CACHE
// ================================================================
function getCachedUserData() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    const timestamp = localStorage.getItem('ARVEXA_user_data_timestamp');
    if (!cached) return null;
    if (timestamp) {
      const age = Date.now() - parseInt(timestamp);
      if (age > 300000) return null;
    }
    return JSON.parse(cached);
  } catch(e) { return null; }
}

function setCachedUserData(data) {
  localStorage.setItem('ARVEXA_user_data', JSON.stringify(data));
  localStorage.setItem('ARVEXA_user_data_timestamp', String(Date.now()));
}

function loadFromCache() {
  const cached = getCachedUserData();
  if (cached) {
    userData = cached;
    userDefis = cached.defisHebdo || {};
    return true;
  }
  return false;
}

// ================================================================
// FORMAT CURRENCY
// ================================================================
function formatCurrency(amount) {
  if (!amount) return '0 FCFA';
  return amount.toLocaleString('fr-FR') + ' FCFA';
}

// ================================================================
// RENDRE LES QUESTIONS
// ================================================================
function renderQuestions() {
  reponses = new Array(QUESTIONS.length).fill(-1);
  
  let html = '';
  QUESTIONS.forEach((q, index) => {
    html += `
      <div class="question-item">
        <div class="q-text">${index + 1}. ${q.question}</div>
        <div class="q-options" data-q="${index}">
          ${q.options.map((opt, optIndex) => `
            <label data-opt="${optIndex}">
              <input type="radio" name="q${index}" value="${optIndex}">
              ${opt}
            </label>
          `).join('')}
        </div>
      </div>
    `;
  });
  questionsContainer.innerHTML = html;
  
  // Événements radio
  document.querySelectorAll('.question-item input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', function() {
      const qIndex = parseInt(this.name.replace('q', ''));
      const optIndex = parseInt(this.value);
      reponses[qIndex] = optIndex;
      
      const parent = this.closest('.q-options');
      parent.querySelectorAll('label').forEach(label => {
        label.classList.remove('selected');
      });
      this.closest('label').classList.add('selected');
    });
  });
}

// ================================================================
// VÉRIFIER SI LE DÉFI EST DÉJÀ FAIT
// ================================================================
async function checkIfAlreadyDone() {
  if (userDefis && userDefis.lundi && userDefis.lundi.fait) {
    showToast('✅ Vous avez déjà terminé ce défi !', 'warning');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '✅ Défi déjà terminé';
    return true;
  }
  return false;
}

// ================================================================
// SOUMETTRE LE QUIZ
// ================================================================
async function submitQuiz() {
  if (isSubmitting) return;
  
  // Vérifier si toutes les questions ont une réponse
  const toutesRepondues = reponses.every(r => r !== -1);
  if (!toutesRepondues) {
    showToast('⚠️ Répondez à toutes les questions !', 'warning');
    return;
  }
  
  // Vérifier si déjà fait
  const alreadyDone = await checkIfAlreadyDone();
  if (alreadyDone) return;
  
  isSubmitting = true;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="loader"></span> Vérification...';
  
  // Compter les bonnes réponses
  let score = 0;
  QUESTIONS.forEach((q, index) => {
    if (reponses[index] === q.bonne) {
      score++;
    }
  });
  
  const scoreRequis = 7;
  const reussite = score >= scoreRequis;
  const reward = 40;
  
  // Afficher les résultats
  QUESTIONS.forEach((q, index) => {
    const optLabels = document.querySelectorAll(`.question-item:nth-child(${index + 1}) .q-options label`);
    optLabels.forEach((label, optIndex) => {
      label.classList.remove('selected');
      if (optIndex === q.bonne) {
        label.classList.add('correct');
      }
      if (optIndex === reponses[index] && optIndex !== q.bonne) {
        label.classList.add('wrong');
      }
    });
  });
  
  if (reussite) {
    // ✅ Succès - Enregistrer dans Firestore
    try {
      const userRef = doc(db, 'users', currentUser.uid);
      const defisHebdo = { ...(userDefis || {}) };
      defisHebdo.lundi = {
        fait: true,
        score: score,
        reward: reward,
        date: new Date().toISOString()
      };
      
      await updateDoc(userRef, {
        defisHebdo: defisHebdo,
        balance: increment(reward),
        gainsTotal: increment(reward),
        totalDefisGagnes: increment(reward)
      });
      
      // Mettre à jour le cache
      userData.defisHebdo = defisHebdo;
      setCachedUserData(userData);
      
      showToast('🎉 Félicitations ! +' + formatCurrency(reward), 'success');
      
      // Rediriger vers la page principale avec les paramètres de succès
      setTimeout(() => {
        window.location.href = 'epargne.html?defi=lundi&reward=' + reward + '&next=Mardi';
      }, 1500);
      
    } catch (error) {
      console.error('Erreur sauvegarde:', error);
      showToast('❌ Erreur lors de la sauvegarde', 'error');
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Valider mes réponses';
    }
    
  } else {
    // ❌ Échec
    showToast('😅 Score: ' + score + '/' + QUESTIONS.length + ' - Réessayez plus tard !', 'error');
    submitBtn.innerHTML = '😅 Réessayer plus tard';
    submitBtn.disabled = true;
    isSubmitting = false;
  }
}

// ================================================================
// CHARGER UTILISATEUR
// ================================================================
async function loadUser(uid) {
  try {
    const userRef = doc(db, 'users', uid);
    const docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      userData = docSnap.data();
      userDefis = userData.defisHebdo || {};
      setCachedUserData(userData);
      return userData;
    }
    return null;
  } catch (error) {
    console.error('Erreur chargement user:', error);
    return null;
  }
}

// ================================================================
// AUTH
// ================================================================
const sessionUid = sessionStorage.getItem('session_uid');

loadFromCache();
renderQuestions();
checkIfAlreadyDone();

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);
    
    if (sessionUid === user.uid) {
      console.debug("✅ Session déjà validée, chargement rapide");
      loadUser(user.uid).then(() => {
        checkIfAlreadyDone();
      });
      isPageLoading = false;
      return;
    }

    loadUser(user.uid).then(() => {
      checkIfAlreadyDone();
    });
    isPageLoading = false;
  } else {
    if (isPageLoading) {
      setTimeout(() => {
        if (!auth.currentUser) {
          const savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          } else {
            window.location.href = 'login.html';
          }
        }
      }, 3000);
    } else {
      const savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(() => {
          if (!auth.currentUser) {
            window.location.href = 'login.html';
          }
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }
    }
  }
});

// ================================================================
// ÉVÉNEMENTS
// ================================================================
quizForm.addEventListener('submit', function(e) {
  e.preventDefault();
  submitQuiz();
});

console.debug('📅 ARVEXA - Défi du Lundi (v2.0)');
console.debug('✅ Quiz Culture Générale');
console.debug('✅ 7/10 pour gagner 40 FCFA');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Assistant IA Universel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --sidebar-width: 300px;
      --header-height: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.5;
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: 
        radial-gradient(ellipse 60% 50% at 15% 15%, rgba(184, 134, 11, 0.05) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 85%, rgba(45, 125, 90, 0.03) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      max-width: 85vw;
      height: 100%;
      background: rgba(10, 10, 10, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(184, 134, 11, 0.1);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .sidebar .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(184, 134, 11, 0.1);
      border: 1px solid rgba(184, 134, 11, 0.2);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      margin-bottom: 8px;
      width: 100%;
      min-height: 48px;
    }
    .sidebar .new-chat-btn:active { transform: scale(0.96); }
    .sidebar .new-chat-btn:hover { background: rgba(184, 134, 11, 0.2); }
    .sidebar .new-chat-btn i { font-size: 16px; }

    .sidebar .history-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0 8px;
      opacity: 0.5;
    }

    .sidebar .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar .chat-list::-webkit-scrollbar { width: 2px; }
    .sidebar .chat-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar .chat-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .sidebar .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-dim);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      min-height: 40px;
    }
    .sidebar .chat-item:active { transform: scale(0.96); }
    .sidebar .chat-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
    .sidebar .chat-item.active { background: rgba(184, 134, 11, 0.08); color: var(--accent); }

    .sidebar .chat-item i { font-size: 14px; color: var(--accent); flex-shrink: 0; }
    .sidebar .chat-item .chat-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar .chat-item .chat-delete { color: var(--text-dim); opacity: 0.3; cursor: pointer; font-size: 12px; transition: var(--transition); padding: 4px 6px; border-radius: 4px; flex-shrink: 0; }
    .sidebar .chat-item .chat-delete:hover { opacity: 1; color: var(--danger); }

    .sidebar .sidebar-footer {
      padding-top: 12px;
      border-top: 1px solid rgba(184, 134, 11, 0.06);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar .sidebar-footer a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      transition: var(--transition);
      cursor: pointer;
      min-height: 40px;
    }
    .sidebar .sidebar-footer a:active { transform: scale(0.96); }
    .sidebar .sidebar-footer a:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-light); }
    .sidebar .sidebar-footer a i { font-size: 16px; color: var(--accent); }
    .sidebar .sidebar-footer .logout-btn { color: #7A4A4A; }
    .sidebar .sidebar-footer .logout-btn i { color: #7A4A4A; }
    .sidebar .sidebar-footer .logout-btn:hover { background: rgba(122, 74, 74, 0.08); }

    /* ============================================================
       OVERLAY
       ============================================================ */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 3, 5, 0.5);
      backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .sidebar-overlay.show { opacity: 1; visibility: visible; }

    /* ============================================================
       HEADER
       ============================================================ */
    .ia-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      height: var(--header-height);
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.06);
    }
    .ia-header .header-left { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .ia-header .header-center {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      color: var(--text-light);
      white-space: nowrap;
    }
    .ia-header .header-center span { color: var(--accent); }
    .ia-header .header-right { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }

    .ia-header .menu-toggle {
      width: 38px;
      height: 38px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      transition: var(--transition);
      font-size: 16px;
      min-width: 38px;
    }
    .ia-header .menu-toggle:active { transform: scale(0.92); }
    .ia-header .menu-toggle:hover { border-color: rgba(184, 134, 11, 0.3); }

    .ia-header .header-status {
      font-size: 11px;
      color: var(--success);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ia-header .header-status i { font-size: 8px; }

    .user-name-header {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============================================================
       CHAT CONTAINER
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: var(--max-content-width);
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
      position: relative;
    }

    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--header-height) + 12px);
      padding-bottom: 12px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 8px 20px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

    /* ===== MESSAGES ===== */
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      animation: messageIn 0.3s ease-out;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Message Utilisateur - Noir avec brillance */
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1A1A1A, #0A0A0A);
      border: 1px solid rgba(184, 134, 11, 0.08);
      box-shadow: 0 0 30px rgba(184, 134, 11, 0.03), inset 0 0 30px rgba(184, 134, 11, 0.02);
      color: var(--text-light);
      border-bottom-right-radius: 4px;
    }

    /* Message Assistant - Style épuré */
    .message.ia {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-bottom-left-radius: 4px;
      color: #D4C8A8;
    }

    .message .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      display: block;
      opacity: 0.4;
    }
    .message.user .msg-time { color: var(--text-muted); }

    .message .msg-strong {
      font-weight: 600;
      color: var(--accent);
    }
    .message.ia .msg-strong { color: #D4A017; }

    .message .msg-block {
      display: block;
      margin: 6px 0 2px;
    }
    .message .msg-list {
      padding-left: 18px;
      margin: 4px 0;
      list-style: none;
    }
    .message .msg-list li {
      position: relative;
      padding: 2px 0 2px 16px;
    }
    .message .msg-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .message .msg-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 8px 14px;
      background: rgba(184, 134, 11, 0.08);
      border: 1px solid rgba(184, 134, 11, 0.10);
      color: var(--accent);
      font-weight: 500;
      font-size: 13px;
      border-radius: 10px;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }
    .message .msg-link:active { transform: scale(0.97); }
    .message .msg-link:hover { background: rgba(184, 134, 11, 0.15); }

    /* ============================================================
       TYPING INDICATOR
       ============================================================ */
    .typing-indicator {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: 16px;
      padding: 12px 18px;
      display: none;
      gap: 4px;
      border-bottom-left-radius: 4px;
    }
    .typing-indicator.show { display: flex; }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingDot 1.4s ease-in-out infinite both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0s; }
    @keyframes typingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       INPUT - COMPACT
       ============================================================ */
    .chat-input-wrapper {
      flex-shrink: 0;
      padding: 0 0 8px;
      background: transparent;
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(184, 134, 11, 0.10);
      border-radius: 14px;
      transition: var(--transition);
      backdrop-filter: blur(12px);
    }
    .chat-input-area:focus-within {
      border-color: var(--accent);
      background: rgba(10, 10, 10, 0.95);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.05);
    }

    .chat-input-area .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-input-area input {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      min-height: 24px;
    }
    .chat-input-area input::placeholder {
      color: var(--text-dim);
      opacity: 0.5;
    }

    .chat-input-area .btn-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }

    .chat-input-area .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 15px;
      flex-shrink: 0;
      touch-action: manipulation;
      background: transparent;
      color: var(--text-muted);
    }
    .chat-input-area .btn-icon:active { transform: scale(0.92); }
    .chat-input-area .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-input-area .btn-icon:hover { color: var(--text-light); }

    .chat-input-area .send-btn {
      background: linear-gradient(135deg, var(--accent), #9A7209);
      color: var(--bg-dark);
      width: 38px;
      height: 38px;
      font-size: 16px;
    }
    .chat-input-area .send-btn:hover { background: #9A7209; transform: scale(1.02); }
    .chat-input-area .send-btn:disabled { opacity: 0.4; }

    .chat-input-area .mic-btn.listening {
      background: rgba(138, 58, 58, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      animation: pulseMic 1.2s ease-in-out infinite;
    }
    .chat-input-area .mic-btn.listening i { color: var(--danger); }
    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ============================================================
       SKELETON
       ============================================================ */
    .skeleton-message {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 70%;
      animation: skeletonPulse 1.2s ease-in-out infinite;
    }
    .skeleton-message .skeleton-line {
      height: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .skeleton-message .skeleton-line:last-child { margin-bottom: 0; }
    .skeleton-message .skeleton-line.w60 { width: 60%; }
    .skeleton-message .skeleton-line.w40 { width: 40%; }
    .skeleton-message .skeleton-line.w30 { width: 30%; }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 420px;
      width: 90%;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid rgba(184, 134, 11, 0.10);
      color: var(--text-light);
    }
    .toast.show { transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.success { border-color: var(--success); color: var(--success); }

        /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      :root { --header-height: 56px; --sidebar-width: 280px; }
      .ia-header .header-center { font-size: 16px; }
      .user-name-header { font-size: 11px; max-width: 60px; }
      .ia-header .menu-toggle { width: 34px; height: 34px; font-size: 14px; min-width: 34px; }
      .message { max-width: 92%; font-size: 14px; padding: 10px 14px; }
      .chat-input-area { padding: 4px 10px; border-radius: 12px; gap: 6px; }
      .chat-input-area input { font-size: 13px; min-height: 20px; padding: 6px 0; }
      .chat-input-area .btn-icon { width: 30px; height: 30px; font-size: 13px; }
      .chat-input-area .send-btn { width: 34px; height: 34px; font-size: 14px; }
      .chat-container { padding-top: calc(var(--header-height) + 8px); }
      .chat-messages { padding: 12px 4px 16px; gap: 10px; }
    }

    @media (min-width: 769px) {
      .message { max-width: 75%; font-size: 15px; padding: 14px 18px; }
      .chat-input-area { padding: 8px 16px; }
      .chat-input-area input { font-size: 15px; }
      .sidebar { width: 320px; }
      .sidebar .chat-item { font-size: 15px; padding: 12px 16px; }
      .sidebar .new-chat-btn { font-size: 16px; padding: 16px 18px; }
    }
  </style>
</head>
<body>

<!-- ===== BACKGROUND ===== -->
<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<!-- ============================================================
     OVERLAY
     ============================================================ -->
<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<div class="sidebar" id="sidebar" role="navigation" aria-label="Menu principal">
  <button class="new-chat-btn" id="newChatBtn">
    <i class="fas fa-plus" aria-hidden="true"></i> Nouvelle discussion
  </button>

  <div class="history-title">📋 Discussions</div>
  <div class="chat-list" id="chatList" role="list">
    <div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
      <i class="fas fa-spinner fa-spin" style="display:block; margin-bottom:8px; font-size:20px;" aria-hidden="true"></i>
      Chargement...
    </div>
  </div>

  <div class="sidebar-footer">
    <a href="index.html"><i class="fas fa-home" aria-hidden="true"></i> Accueil</a>
    <a href="ebooks.html"><i class="fas fa-book" aria-hidden="true"></i> E-books</a>
    <a href="services.html"><i class="fas fa-cogs" aria-hidden="true"></i> Services</a>
    <a href="#" class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Se déconnecter</a>
  </div>
</div>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="ia-header" role="banner">
  <div class="header-left">
    <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
  </div>

  <div class="header-center">

// ================================================================

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    if (micBtn) micBtn.style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    if (micBtn) {
      micBtn.classList.add('listening');
      micBtn.innerHTML = '<i class="fas fa-circle" style="color: #8A3A3A; font-size:12px;"></i>';
    }
  };
  recognition.onerror = (event) => { 
    console.error('Erreur reconnaissance:', event.error); 
    stopListening(); 
    showToast('Erreur microphone. Réessayez.', 'error');
  };
  recognition.onend = () => { stopListening(); };
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    if (chatInput) chatInput.value = transcript.trim();
  };
}

function startListening() {
  if (!recognition) { showToast('Reconnaissance vocale non supportée.', 'error'); return; }
  if (isListening) { stopListening(); return; }
  try { recognition.start(); } catch (error) { console.error('Erreur démarrage:', error); }
}

function stopListening() {
  isListening = false;
  if (micBtn) {
    micBtn.classList.remove('listening');
    micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
  }
  try { if (recognition) recognition.stop(); } catch (error) {}
}

if (micBtn) {
  micBtn.addEventListener('click', startListening);
  micBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startListening();
  });
}

function addMessage(text, sender, time) {

    skeletonMessage.style.display = 'none';

  const div = document.createElement('div');
  div.className = `message ${sender}`;
  
  let formattedText = text
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong class="msg-strong">$1</strong>')
    .replace(/^• /gm, '<span class="msg-block">• </span>')
    .replace(/^\d+\. /gm, '<span class="msg-block">$&</span>');
  
  div.innerHTML = `${formattedText}<span class="msg-time">${time || 'Maintenant'}</span>`;
  chatMessages.appendChild(div);
  
  requestAnimationFrame(() => {
    if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

// ================================================================
async function callMistral(userMessage) {
  if (!MISTRAL_API_KEY || MISTRAL_API_KEY === 'VOTRE_CLE_API_MISTRAL') {
    return simulateResponse(userMessage);
  }

  try {
    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      ...conversationHistory.map(msg => ({
        role: msg.sender === 'user' ? 'user' : 'assistant',
        content: msg.text
      })),
      { role: 'user', content: userMessage }
    ];

    const response = await fetch(MISTRAL_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MISTRAL_API_KEY}` },
      body: JSON.stringify({ 
        model: 'mistral-large-latest', 
        messages, 
        temperature: 0.7, 
        max_tokens: 800  // ✅ Augmenté pour les réponses longues
      })
    });

    if (!response.ok) throw new Error(`API Mistral error: ${response.status}`);
    const data = await response.json();
    return data.choices[0]?.message?.content || "Je n'ai pas de réponse pour le moment.";
  } catch (error) {
    console.error('Erreur Mistral:', error);
    return simulateResponse(userMessage);
  }
}

// ================================================================
// ENVOYER UN MESSAGE
// ================================================================
async function sendMessage() {
  if (!chatInput) return;
  const text = chatInput.value.trim();
  if (!text || !currentUser || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;
  const timeStr = formatTime();

  // Créer une nouvelle conversation si nécessaire
  if (!currentChatId) {
    const chatId = 'chat_' + Date.now();
    const newChat = {
      userId: currentUser.uid,
      chatId: chatId,
      name: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
      messages: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    try {
      await setDoc(doc(db, 'ia_chats', chatId), newChat);
      currentChatId = chatId;
    } catch (error) {
      console.error('Erreur création discussion:', error);
      showToast('Erreur lors de la création', 'error');
      isProcessing = false;
      sendBtn.disabled = false;
      return;
    }
  }

  // Ajouter le message utilisateur
  addMessage(text, 'user', timeStr);
  chatInput.value = '';
  conversationHistory.push({ sender: 'user', text });

  // Sauvegarder dans Firestore
  try {
    const chatRef = doc(db, 'ia_chats', currentChatId);
    const chatSnap = await getDoc(chatRef);
    if (chatSnap.exists()) {
      const chat = chatSnap.data();
      const messages = [...(chat.messages || []), { sender: 'user', text, time: timeStr }];
      const name = messages.length === 1 ? text.substring(0, 30) + (text.length > 30 ? '...' : '') : chat.name;
      await updateDoc(chatRef, { messages, name, updatedAt: new Date().toISOString() });
    }
  } catch (error) {
    console.error('Erreur sauvegarde message:', error);
  }

  // Afficher le typing indicator
  typingIndicator.classList.add('show');
  if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;

  // Attendre un peu puis répondre
  setTimeout(async () => {
    // ✅ Le typing indicator disparaît EN MÊME TEMPS que la réponse apparaît
    const response = await getResponse(text);
    const responseTime = formatTime();

    // ✅ Supprimer le typing indicator ET ajouter la réponse en même temps
    typingIndicator.classList.remove('show');
    conversationHistory.push({ sender: 'ia', text: response });
    addMessage(response, 'ia', responseTime);

    // Sauvegarder la réponse
    try {
      const chatRef2 = doc(db, 'ia_chats', currentChatId);
      const chatSnap2 = await getDoc(chatRef2);
      if (chatSnap2.exists()) {
        const chat = chatSnap2.data();
        const messages = [...(chat.messages || []), { sender: 'ia', text: response, time: responseTime }];
        await updateDoc(chatRef2, { messages, updatedAt: new Date().toISOString() });
      }
    } catch (error) {
      console.error('Erreur sauvegarde réponse:', error);
    }

    if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
    renderChatList();
    isProcessing = false;
    sendBtn.disabled = false;
    chatInput.focus();
  }, 600 + Math.random() * 400);
}

// ================================================================
// GESTION DES DISCUSSIONS
// ================================================================
function getChatsCache() {
  try { return JSON.parse(localStorage.getItem(`arvexa_chats_${currentUser?.uid}`) || '[]'); } catch { return []; }
}

function saveChatsCache(chats) {
  try { localStorage.setItem(`arvexa_chats_${currentUser?.uid}`, JSON.stringify(chats)); } catch (e) {}
}

let unsubscribeChats = null;

function listenChats() {
  if (!currentUser) return;
  if (unsubscribeChats) {
    unsubscribeChats();
    unsubscribeChats = null;
  }

  const q = query(collection(db, 'ia_chats'), where('userId', '==', currentUser.uid));

  unsubscribeChats = onSnapshot(q, (snapshot) => {
    const chats = [];
    snapshot.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
    chats.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    allChats = chats;
    saveChatsCache(chats);
    renderChatList();
  }, (error) => {
    console.error('Erreur écoute discussions:', error);
    const cached = getChatsCache();
    if (cached.length > 0) { allChats = cached; renderChatList(); }
  });
}

function renderChatList() {
  if (!chatList) return;
  if (allChats.length === 0) {
    chatList.innerHTML = `<div style="text-align:center; padding:20px; color: var(--text-dim); font-size:12px; opacity:0.5;">
      <i class="fas fa-comment" style="display:block; margin-bottom:8px; font-size:20px;"></i>
      Aucune discussion
    </div>`;
    return;
  }

  let html = '';
  allChats.forEach(chat => {
    const isActive = chat.id === currentChatId ? 'active' : '';
    const name = chat.name || 'Nouvelle discussion';
    html += `<div class="chat-item ${isActive}" data-chatid="${chat.id}" role="listitem">
      <i class="fas fa-comment"></i>
      <span class="chat-name">${escapeHtml(name)}</span>
      <span class="chat-delete" data-chatid="${chat.id}"><i class="fas fa-times"></i></span>
    </div>`;
  });
  chatList.innerHTML = html;

  chatList.querySelectorAll('.chat-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.closest('.chat-delete')) return;
      const chatId = item.dataset.chatid;
      if (chatId) loadChat(chatId);
      closeMenu();
    });
  });

  chatList.querySelectorAll('.chat-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const chatId = btn.dataset.chatid;
      if (chatId && confirm('Supprimer cette discussion ?')) {
        try {
          await deleteDoc(doc(db, 'ia_chats', chatId));
          showToast('Discussion supprimée', 'info');
          if (currentChatId === chatId) {
            currentChatId = null;
            conversationHistory = [];
            const name = userData?.prenom || '';
            const welcomeMsg = name 
              ? `Bonjour ${name}, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?`
              : 'Bonjour, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd\'hui ?';
            if (chatMessages) {
              chatMessages.innerHTML = '';
              addMessage(welcomeMsg, 'ia', 'Maintenant');
            }
          }
        } catch (error) {
          console.error('Erreur suppression:', error);
          showToast('Erreur lors de la suppression', 'error');
        }
      }
    });
  });
}

async function createNewChat() {
  if (!currentUser) { showToast('Veuillez vous connecter', 'error'); return; }
  try {
    const chatId = 'chat_' + Date.now();
    const newChat = {
      userId: currentUser.uid,
      chatId: chatId,
      name: 'Nouvelle discussion',
      messages: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    await setDoc(doc(db, 'ia_chats', chatId), newChat);
    currentChatId = chatId;
    conversationHistory = [];
    const name = userData?.prenom || '';
    const welcomeMsg = name 
      ? `Bonjour ${name}, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?`
      : 'Bonjour, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd\'hui ?';
    if (chatMessages) {
      chatMessages.innerHTML = '';
      addMessage(welcomeMsg, 'ia', 'Maintenant');
    }
    closeMenu();
    showToast('Nouvelle discussion créée', 'info');
  } catch (error) {
    console.error('Erreur création:', error);
    showToast('Erreur lors de la création', 'error');
  }
}

async function loadChat(chatId) {
  try {
    const chatRef = doc(db, 'ia_chats', chatId);
    const chatSnap = await getDoc(chatRef);
    if (chatSnap.exists()) {
      const chat = chatSnap.data();
      currentChatId = chatId;
      conversationHistory = [];
      if (chatMessages) {
        chatMessages.innerHTML = '';
        (chat.messages || []).forEach(msg => {
          addMessage(msg.text, msg.sender, msg.time);
          if (msg.sender === 'user' || msg.sender === 'ia') {
            conversationHistory.push({ sender: msg.sender, text: msg.text });
          }
        });
        // Si pas de messages, afficher le message de bienvenue
        if ((chat.messages || []).length === 0) {
          const name = userData?.prenom || '';
          const welcomeMsg = name 
            ? `Bonjour ${name}, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?`
            : 'Bonjour, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd\'hui ?';
          addMessage(welcomeMsg, 'ia', 'Maintenant');
        }
      }
      renderChatList();
    }
  } catch (error) {
    console.error('Erreur chargement:', error);
  }
}

// ================================================================
// GESTION DU MENU
// ================================================================
function openMenu() {
  if (sidebar) sidebar.classList.add('open');
  if (sidebarOverlay) sidebarOverlay.classList.add('show');
  if (menuToggle) menuToggle.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
}

function closeMenu() {
  if (sidebar) sidebar.classList.remove('open');
  if (sidebarOverlay) sidebarOverlay.classList.remove('show');
  if (menuToggle) menuToggle.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}

if (menuToggle) {
  menuToggle.addEventListener('click', openMenu);
  menuToggle.addEventListener('touchstart', (e) => {
    e.preventDefault();
    sidebar?.classList.contains('open') ? closeMenu() : openMenu();
  });
}

if (sidebarOverlay) {
  sidebarOverlay.addEventListener('click', closeMenu);
  sidebarOverlay.addEventListener('touchstart', closeMenu);
}

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const deltaX = e.changedTouches[0].clientX - touchStartX;
  const deltaY = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(deltaX) < Math.abs(deltaY)) return;
  const isOpen = sidebar?.classList.contains('open');
  if (!isOpen && deltaX > 60) openMenu();
  else if (isOpen && deltaX < -60) closeMenu();
}, { passive: true });

// ================================================================
// ÉVÉNEMENTS
// ================================================================
if (chatInput) {
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  // Focus automatique sur l'input
  chatInput.focus();
}

if (sendBtn) {
  sendBtn.addEventListener('click', sendMessage);
  sendBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    sendMessage();
  });
}

if (newChatBtn) {
  newChatBtn.addEventListener('click', createNewChat);
  newChatBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    createNewChat();
  });
}

// ================================================================
// LOGOUT
// ================================================================
logoutBtn.addEventListener('click', async (e) => {
  e.preventDefault();
  if (confirm('Voulez-vous vous déconnecter ?')) {
    try {
      await signOut(auth);
      localStorage.removeItem('ARVEXA_current_user');
      localStorage.removeItem('ARVEXA_user_data');
      sessionStorage.clear();
      showToast('Déconnexion réussie', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 500);
    } catch (error) {
      console.error('Erreur déconnexion:', error);
      showToast('Erreur lors de la déconnexion', 'error');
    }
  }
});

// ================================================================
// CACHE POUR RETOUR ARRIÈRE INSTANTANÉ
// ================================================================
window.addEventListener('pageshow', function(event) {
  if (event.persisted) {
    console.debug('📱 Page chat chargée depuis le cache');
    loadFromCache();
    if (currentUser) {
      listenChats();
    }
  }
});

// ================================================================
// AUTH
// ================================================================
let authChecked = false;

// Chargement rapide depuis le cache
loadFromCache();

// Afficher le message de bienvenue si les données sont en cache
if (userData) {
  const name = userData.prenom || '';
  const welcomeMsg = name 
    ? `Bonjour ${name}, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?`
    : 'Bonjour, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd\'hui ?';
  if (chatMessages) {
    chatMessages.innerHTML = '';
    addMessage(welcomeMsg, 'ia', 'Maintenant');
    if (skeletonMessage) skeletonMessage.style.display = 'none';
  }
} else {
  // Afficher le skeleton si pas de cache
  if (skeletonMessage) skeletonMessage.style.display = 'block';
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);

    try {
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) {
        userData = userSnap.data();
        setCachedUserData(userData);
        updateHeader(userData);
        
        // Mettre à jour le message de bienvenue
        const name = userData.prenom || '';
        const welcomeMsg = name 
          ? `Bonjour ${name}, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?`
          : 'Bonjour, bienvenue sur ARVEXA. Je suis votre assistant. Comment puis-je vous aider aujourd\'hui ?';
        
        // Ne remplacer que si c'est la première conversation ou si pas de messages
        if (chatMessages && chatMessages.children.length <= 1) {
          chatMessages.innerHTML = '';
          addMessage(welcomeMsg, 'ia', 'Maintenant');
          if (skeletonMessage) skeletonMessage.style.display = 'none';
        }
      }
    } catch (error) {
      console.error('Erreur récupération utilisateur:', error);
    }

    listenChats();
    // Charger la dernière conversation
    const cached = getChatsCache();
    if (cached.length > 0) {
      // Trouver la dernière conversation active
      const lastChat = cached[0];
      if (lastChat && !currentChatId) {
        loadChat(lastChat.id);
      }
    }

    authChecked = true;
  } else {
    const savedUid = localStorage.getItem('ARVEXA_current_user');
    if (savedUid) {
      setTimeout(() => {
        if (!auth.currentUser) {
          localStorage.removeItem('ARVEXA_current_user');
          window.location.href = 'login.html';
        }
      }, 2000);
    } else {
      window.location.href = 'login.html';
    }
  }
});

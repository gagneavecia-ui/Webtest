<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Défis hebdomadaires">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.10) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent); font-style: italic; }

    .back-btn {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(184, 134, 11, 0.08); }
    .back-btn i { font-size: clamp(14px, 1.8vw, 18px); }

    .header-placeholder {
      width: clamp(32px, 4vw, 40px);
      flex-shrink: 0;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 5% 40px;
      width: 100%;
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      animation: skeletonPulse 1.2s ease-in-out infinite;
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .skeleton-text { height: 14px; width: 100%; margin-bottom: 6px; border-radius: 4px; }
    .skeleton-text.w60 { width: 60%; }
    .skeleton-text.w40 { width: 40%; }
    .skeleton-text.w30 { width: 30%; }
    .skeleton-value { height: 32px; width: 70%; border-radius: 8px; }

    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: var(--radius);
      padding: clamp(16px, 3vw, 24px);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
      width: 100%;
      overflow: hidden;
    }
    .card:hover { border-color: rgba(184, 134, 11, 0.08); }

    /* ===== HERO ===== */
    .hero {
      background: linear-gradient(135deg, rgba(26, 58, 42, 0.20), rgba(10, 26, 18, 0.10));
      border-radius: var(--radius);
      padding: 28px 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(184, 134, 11, 0.10);
      text-align: center;
    }
    .hero-icon { font-size: 40px; color: var(--accent); margin-bottom: 10px; display: block; }
    .hero h1 { font-size: 24px; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--text-light); }
    .hero h1 span { color: var(--accent); font-style: italic; }
    .hero p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

    /* ===== PROGRESS ===== */
    .progress-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .progress-card .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-card .progress-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
    }
    .progress-card .progress-title span { color: var(--accent); }
    .progress-card .progress-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar .bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.5s ease;
      width: 0%;
    }

    /* ===== DEFIS GRID ===== */
    .defis-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .defi-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      opacity: 0;
      animation: fadeInUp 0.4s ease forwards;
      cursor: pointer;
    }
    .defi-card:nth-child(1) { animation-delay: 0.05s; }
    .defi-card:nth-child(2) { animation-delay: 0.10s; }
    .defi-card:nth-child(3) { animation-delay: 0.15s; }
    .defi-card:nth-child(4) { animation-delay: 0.20s; }
    .defi-card:nth-child(5) { animation-delay: 0.25s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .defi-card:active { transform: scale(0.98); }
    .defi-card:hover { border-color: rgba(184, 134, 11, 0.08); }
    .defi-card.disabled { opacity: 0.5; cursor: not-allowed; }
    .defi-card.disabled:hover { border-color: var(--card-border); transform: none; }
    .defi-card.completed { border-color: rgba(45, 125, 90, 0.20); background: rgba(45, 125, 90, 0.04); }

    .defi-card .defi-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .defi-card .defi-icon.quiz { background: rgba(184, 134, 11, 0.10); color: var(--accent); }
    .defi-card .defi-icon.jeu { background: rgba(45, 125, 90, 0.10); color: var(--success); }
    .defi-card .defi-icon.special { background: rgba(138, 58, 58, 0.10); color: #8A3A3A; }
    .defi-card .defi-icon.final { background: rgba(99, 102, 241, 0.10); color: #6366F1; }
    .defi-card .defi-icon.locked { background: rgba(255,255,255,0.03); color: var(--text-muted); }

    .defi-card .defi-content { flex: 1; min-width: 0; }
    .defi-card .defi-day {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .defi-card .defi-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
    }
    .defi-card .defi-desc {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 300;
    }
    .defi-card .defi-reward {
      font-size: 14px;
      font-weight: 700;
      color: var(--success);
      text-align: right;
      flex-shrink: 0;
    }

    .defi-card .defi-status {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
    }
    .defi-card .defi-status.done { color: var(--success); }
    .defi-card .defi-status.locked { color: var(--text-muted); opacity: 0.3; }
    .defi-card .defi-status.available { color: var(--accent); }
    .defi-card .defi-status.failed { color: var(--danger); }

    .defi-card .defi-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      margin-top: 4px;
    }
    .defi-card .defi-btn.start {
      background: var(--accent);
      color: var(--bg-dark);
    }
    .defi-card .defi-btn.start:active { transform: scale(0.95); }
    .defi-card .defi-btn.start:hover { background: #9A7209; }

    .defi-card .defi-btn.done {
      background: rgba(45, 125, 90, 0.12);
      color: var(--success);
      cursor: default;
    }
    .defi-card .defi-btn.locked {
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    .defi-card .defi-btn.failed {
      background: rgba(138, 58, 58, 0.10);
      color: var(--danger);
      cursor: default;
    }

    /* ============================================================
       MODALE SUCCÈS
       ============================================================ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 3, 5, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 20px;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: linear-gradient(145deg, #141414 0%, #0A0A0A 100%);
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      transform: scale(0.92) translateY(20px);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--success), var(--accent), transparent);
      background-size: 200% 100%;
      animation: shimmerGold 3s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes shimmerGold {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .modal-header .modal-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-header .modal-title span {
      color: var(--accent);
      font-style: italic;
    }
    .modal-header .modal-title i {
      color: var(--accent);
      font-size: 22px;
    }
    .modal-close-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(184, 134, 11, 0.04);
      border: 1px solid rgba(184, 134, 11, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 14px;
      flex-shrink: 0;
    }
    .modal-close-btn:hover {
      background: rgba(184, 134, 11, 0.08);
      border-color: rgba(184, 134, 11, 0.12);
      color: var(--text-light);
    }
    .modal-close-btn:active { transform: scale(0.92); }

    .modal-body {
      padding: 20px 24px 24px;
      text-align: center;
    }
    .modal-body .success-icon {
      font-size: 64px;
      color: var(--success);
      display: block;
      margin-bottom: 12px;
    }
    .modal-body h2 {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: 24px;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .modal-body h2 span { color: var(--accent); font-style: italic; }
    .modal-body p { color: var(--text-dim); font-size: 14px; line-height: 1.6; }
    .modal-body .reward-amount {
      font-size: 32px;
      font-weight: 700;
      color: var(--success);
      font-family: 'Playfair Display', 'Georgia', serif;
      margin: 8px 0;
    }
    .modal-body .next-defi {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(184, 134, 11, 0.04);
      border-radius: 10px;
      border: 1px solid rgba(184, 134, 11, 0.06);
      font-size: 12px;
      color: var(--text-muted);
    }
    .modal-body .next-defi strong { color: var(--accent); }

    .modal-footer {
      padding: 16px 24px 24px;
      border-top: 1px solid rgba(184, 134, 11, 0.04);
      display: flex;
      gap: 10px;
    }
    .modal-footer .btn-primary {
      flex: 1;
      padding: 12px 20px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: var(--bg-dark);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .modal-footer .btn-primary:hover {
      background: #9A7209;
      box-shadow: 0 0 30px rgba(184, 134, 11, 0.15);
      transform: translateY(-1px);
    }
    .modal-footer .btn-primary:active { transform: scale(0.97); }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #0D2A1F; border: 1px solid #2D7D5A; color: #2D7D5A; }
    .toast.error { background: #2A0D0D; border: 1px solid #8A3A3A; color: #8A3A3A; }
    .toast.warning { background: #2A1A0D; border: 1px solid #B8860B; color: #B8860B; }
    .toast.info { background: #0D1A2A; border: 1px solid #4A7A8A; color: #4A7A8A; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .container { padding: 12px 12px 30px; }
      .hero h1 { font-size: 20px; }
      .defi-card { flex-wrap: wrap; padding: 14px; }
      .defi-card .defi-reward { width: 100%; text-align: left; }
      .defi-card .defi-status { top: 6px; right: 6px; font-size: 14px; }
      .modal-content { max-width: 100%; margin: 10px; }
    }

    @media (min-width: 768px) {
      .container { max-width: 700px; padding: 24px 24px 40px; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <a href="index.html" class="logo">ARVE<span>XA</span></a>
  <span class="header-placeholder"></span>
</header>

<main class="container">

  <!-- ===== HERO ===== -->
  <div class="hero">
    <span class="hero-icon"><i class="fas fa-trophy"></i></span>
    <h1>🏆 Défis <span>Hebdomadaires</span></h1>
    <p>Chaque semaine, gagnez jusqu'à <strong>300 FCFA</strong> en relevant des défis</p>
  </div>

  <!-- ===== PROGRESS ===== -->
  <div class="progress-card">
    <div class="progress-header">
      <span class="progress-title">Progression <span>hebdomadaire</span></span>
      <span class="progress-value" id="progressValue">0 / 300 FCFA</span>
    </div>
    <div class="progress-bar">
      <div class="bar" id="progressBar"></div>
    </div>
  </div>

  <!-- ===== DÉFIS ===== -->
  <div class="defis-grid" id="defisGrid">
    <!-- Généré par JavaScript -->
  </div>

</main>

<!-- ===== MODALE SUCCÈS ===== -->
<div class="modal-overlay" id="successModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">
        <i class="fas fa-trophy"></i>
        Félicitations <span>!</span>
      </div>
      <button class="modal-close-btn" id="closeSuccessModal">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body">
      <span class="success-icon"><i class="fas fa-check-circle"></i></span>
      <h2>Défi <span>terminé</span> !</h2>
      <p id="successMessage">Vous avez gagné</p>
      <div class="reward-amount" id="successReward">+40 FCFA</div>
      <div class="next-defi" id="successNext">
        ⏳ Prochain défi : <strong id="nextDefiName">Mardi</strong> à <strong>00h00</strong>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="successBtn">
        <i class="fas fa-home"></i> Retour aux défis
      </button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ================================================================ -->
<!-- CONFIGURATION CENTRALISÉE -->
<!-- ================================================================ -->
<script src="config.js"></script>

<!-- ================================================================ -->
<!-- IMPORTS -->
<!-- ================================================================ -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }
}
</script>

<script type="module">

// ================================================================
// IMPORTS
// ================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { 
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  onSnapshot,

// ================================================================

// ================================================================
function getCachedUserData() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    const timestamp = localStorage.getItem('ARVEXA_user_data_timestamp');
    if (!cached) return null;
    if (timestamp) {
      const age = Date.now() - parseInt(timestamp);
      if (age > 300000) return null;
    }
    return JSON.parse(cached);
  } catch(e) { return null; }
}

function setCachedUserData(data) {
  localStorage.setItem('ARVEXA_user_data', JSON.stringify(data));
  localStorage.setItem('ARVEXA_user_data_timestamp', String(Date.now()));
}

function loadFromCache() {
  const cached = getCachedUserData();
  if (cached) {
    userData = cached;
    return true;
  }
  return false;
}

// ================================================================
// ✅ ENREGISTRER LE GAIN DANS 'GAINS'
// ================================================================
async function saveDefiGain(userId, userName, jour, reward) {
  try {
    const today = new Date().toISOString().split('T')[0];
    
    // Vérifier si le gain existe déjà
    const q = query(
      collection(db, 'gains'),
      where('userId', '==', userId),
      where('sourceId', '==', jour),
      where('date', '==', today)
    );
    const snapshot = await getDocs(q);
    
    if (snapshot.empty) {
      await addDoc(collection(db, 'gains'), {
        userId: userId,
        userName: userName || 'Utilisateur',
        montant: reward,
        type: 'defi',
        sourceId: jour,
        sourceType: 'defi',
        date: today,
        timestamp: new Date().toISOString(),
        createdAt: new Date().toISOString()
      });
      console.log('✅ Gain defi enregistré dans gains:', jour, reward);
    }
  } catch (error) {
    console.error('Erreur sauvegarde gain:', error);
  }
}

function formatCurrency(amount) {
  if (!amount) return '0 FCFA';
  return amount.toLocaleString('fr-FR') + ' FCFA';
}

// ================================================================
// JOURS DE LA SEMAINE
// ================================================================
function getJourNom(jour) {
  const jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  return jours[jour] || 'Jour inconnu';
}

function getNumeroSemaine() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = (now - start) / (24 * 60 * 60 * 1000);
  return Math.ceil((diff + start.getDay() + 1) / 7);
}

// ================================================================
// VÉRIFIER LE STATUT D'UN DÉFI
// ================================================================
function getDefiStatus(defiId, userDefis) {
  const now = new Date();
  const jourActuel = now.getDay();
  const defiIndex = DEFIS.findIndex(d => d.id === defiId);
  const jourDefi = defiIndex + 1;
  
  if (userDefis && userDefis[defiId] && userDefis[defiId].fait) {
    return { status: 'done', label: '✅ Terminé', class: 'done' };
  }
  
  if (jourActuel === 0 || jourActuel === 6) {
    return { status: 'locked', label: '🔒 Attendre la semaine', class: 'locked' };
  }
  
  if (jourDefi < jourActuel) {
    return { status: 'failed', label: '⏳ Défi passé', class: 'failed' };
  }
  
  if (jourDefi === jourActuel) {
    return { status: 'available', label: '🎯 Disponible', class: 'available' };
  }
  
  return { status: 'locked', label: `🔒 ${getJourNom(jourDefi)}`, class: 'locked' };
}

// ================================================================
// RENDRE LES DÉFIS
// ================================================================
function renderDefis() {
  const userDefis = userData?.defisHebdo || {};
  const totalGagne = DEFIS.reduce((sum, d) => {
    if (userDefis[d.id] && userDefis[d.id].fait) {
      return sum + d.recompense;
    }
    return sum;
  }, 0);
  
  const total = 10000;
  const pourcentage = Math.min((totalGagne / total) * 100, 100);
  progressBar.style.width = pourcentage + '%';
  progressValue.textContent = totalGagne + ' / ' + total + ' FCFA';
  
  let html = '';
  DEFIS.forEach((defi, index) => {
    const status = getDefiStatus(defi.id, userDefis);
    const isDone = status.status === 'done';
    const isAvailable = status.status === 'available';
    const isLocked = status.status === 'locked';
    const isFailed = status.status === 'failed';
    
    let btnHtml = '';
    let statusIcon = '';
    let cardClass = '';
    
    if (isDone) {
      btnHtml = `<button class="defi-btn done" disabled>✅ Terminé</button>`;
      statusIcon = '<i class="fas fa-check-circle"></i>';
      cardClass = 'completed';
    } else if (isAvailable) {
      btnHtml = `<button class="defi-btn start" data-id="${defi.id}">🚀 Commencer</button>`;
      statusIcon = '<i class="fas fa-play-circle"></i>';
      cardClass = '';
    } else if (isLocked) {
      btnHtml = `<button class="defi-btn locked" disabled>🔒 ${status.label}</button>`;
      statusIcon = '<i class="fas fa-lock"></i>';
      cardClass = 'disabled';
    } else if (isFailed) {
      btnHtml = `<button class="defi-btn failed" disabled>⏳ Défi passé</button>`;
      statusIcon = '<i class="fas fa-times-circle"></i>';
      cardClass = 'disabled';
    }
    
    const iconClass = defi.iconClass || 'quiz';
    const delay = index * 0.05;
    
    html += `
      <div class="defi-card ${cardClass}" style="animation-delay: ${delay}s;">
        <div class="defi-icon ${iconClass}">
          <i class="fas ${defi.icone || 'fa-question'}"></i>
        </div>
        <div class="defi-content">
          <div class="defi-day">📅 ${defi.nom}</div>
          <div class="defi-title">${defi.titre}</div>
          <div class="defi-desc">${defi.description}</div>
          ${btnHtml}
        </div>
        <div class="defi-reward">+${defi.recompense} FCFA</div>
        <div class="defi-status ${status.class}">${statusIcon}</div>
      </div>
    `;
  });
  
  defisGrid.innerHTML = html;
  
  document.querySelectorAll('.defi-btn.start').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const id = this.dataset.id;
      const defi = DEFIS.find(d => d.id === id);
      if (defi && defi.page) {
        window.location.href = defi.page;
      }
    });
  });
}

// ================================================================
// ÉCOUTER LES CHANGEMENTS DE L'UTILISATEUR
// ================================================================
function listenUser(uid) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }
  
  const userRef = doc(db, 'users', uid);
  unsubscribeUser = onSnapshot(userRef, (snap) => {
    if (snap.exists()) {
      userData = snap.data();
      setCachedUserData(userData);
      renderDefis();
    }
  }, (error) => {
    console.warn('Erreur écoute user:', error);
  });
}

// ================================================================
// CHARGER UTILISATEUR
// ================================================================
async function loadUser(uid) {
  try {
    const userRef = doc(db, 'users', uid);
    const docSnap = await getDoc(userRef);
    if (docSnap.exists()) {
      userData = docSnap.data();
      setCachedUserData(userData);
      return userData;
    }
    return null;
  } catch (error) {
    console.error('Erreur chargement user:', error);
    return null;
  }
}

// ================================================================

// ================================================================
function checkDefiCompletion() {
  const params = new URLSearchParams(window.location.search);
  const defi = params.get('defi');
  const reward = params.get('reward');
  const next = params.get('next');
  
  if (defi && reward) {
    setTimeout(() => {
      showSuccessModal(reward, next);
    }, 500);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}

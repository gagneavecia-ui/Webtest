<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - À propos de la plateforme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ℹ️</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .gradient-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.10) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent); font-style: italic; }

    .back-btn {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(184, 134, 11, 0.08); }
    .back-btn i { font-size: clamp(14px, 1.8vw, 18px); }

    .header-placeholder {
      width: clamp(32px, 4vw, 40px);
      flex-shrink: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 5% 40px;
      width: 100%;
    }

    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(184, 134, 11, 0.06);
      border-radius: var(--radius);
      padding: clamp(20px, 3vw, 28px);
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
      width: 100%;
      overflow: hidden;
    }
    .card:hover { border-color: rgba(184, 134, 11, 0.08); }

    /* ===== HERO ===== */
    .hero {
      text-align: center;
      padding: 24px 16px 20px;
      margin-bottom: 18px;
    }
    .hero-icon { font-size: 42px; color: var(--accent); margin-bottom: 8px; display: block; }
    .hero h1 { 
      font-size: clamp(26px, 4vw, 34px); 
      font-weight: 700; 
      font-family: 'Playfair Display', serif; 
      color: var(--text-light);
    }
    .hero h1 span { color: var(--accent); font-style: italic; }
    .hero p { 
      color: var(--text-dim); 
      font-size: 14px; 
      margin-top: 4px; 
    }

    /* ===== INFO ===== */
    .info-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .info-item:last-child { border-bottom: none; }
    .info-item .info-icon {
      font-size: 18px;
      color: var(--accent);
      width: 30px;
      text-align: center;
      flex-shrink: 0;
    }
    .info-item .info-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      min-width: 90px;
    }
    .info-item .info-value {
      color: var(--text-light);
      font-size: 14px;
      font-weight: 400;
    }

    /* ===== SOCIAL BUTTONS ===== */
    .social-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
    }
    .social-btn:active { transform: scale(0.96); }
    .social-btn.whatsapp { background: #25D366; color: #fff; }
    .social-btn.whatsapp:hover { background: #1DA851; }
    .social-btn.tiktok { background: #000000; color: #fff; border: 1px solid rgba(255,255,255,0.10); }
    .social-btn.tiktok:hover { background: #1A1A1A; border-color: rgba(255,255,255,0.20); }
    .social-btn.call { background: var(--accent); color: var(--bg-dark); }
    .social-btn.call:hover { background: #9A7209; }

    .email-display {
      text-align: center;
      margin-top: 12px;
      padding: 10px;
      background: rgba(10, 10, 10, 0.3);
      border-radius: 10px;
      border: 1px solid rgba(184, 134, 11, 0.04);
    }
    .email-display .email-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .email-display .email-value {
      font-size: 14px;
      color: var(--text-light);
      font-weight: 500;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .container { padding: 12px 4% 30px; }
      .card { padding: 16px; }
      .hero h1 { font-size: 22px; }
      .info-item { flex-wrap: wrap; gap: 6px; }
      .info-item .info-label { min-width: 70px; font-size: 11px; }
      .info-item .info-value { font-size: 13px; }
      .social-buttons { flex-direction: column; align-items: center; }
      .social-btn { width: 100%; justify-content: center; }
    }

    @media (min-width: 768px) {
      .container { max-width: 600px; padding: 24px 5%; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <a href="index.html" class="logo">ARVE<span>XA</span></a>
  <span class="header-placeholder"></span>
</header>

<main class="container">

  <!-- ===== HERO ===== -->
  <div class="hero">
    <span class="hero-icon">✦</span>
    <h1>À Propos d'<span>ARVEXA</span></h1>
    <p>En savoir plus sur la plateforme</p>
  </div>

  <!-- ===== INFORMATIONS ===== -->
  <div class="card">
    <div class="info-item">
      <span class="info-icon"><i class="fas fa-building"></i></span>
      <span class="info-label">Nom</span>
      <span class="info-value">ARVEXA</span>
    </div>
    <div class="info-item">
      <span class="info-icon"><i class="fas fa-user-tie"></i></span>
      <span class="info-label">Créateur</span>
      <span class="info-value">Arvexa Team</span>
    </div>
    <div class="info-item">
      <span class="info-icon"><i class="fas fa-map-marker-alt"></i></span>
      <span class="info-label">Localisation</span>
      <span class="info-value">Niger</span>
    </div>
    <div class="info-item">
      <span class="info-icon"><i class="fas fa-calendar-alt"></i></span>
      <span class="info-label">Année de création</span>
      <span class="info-value">2025</span>
    </div>
    <div class="info-item">
      <span class="info-icon"><i class="fas fa-globe-africa"></i></span>
      <span class="info-label">Pays</span>
      <span class="info-value">Niger 🇳🇪</span>
    </div>
  </div>

  <!-- ===== SUPPORT ===== -->
  <div class="card">
    <div style="text-align:center;margin-bottom:12px;">
      <span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--text-light);">
        📞 <span style="color:var(--accent);font-style:italic;">Support</span>
      </span>
    </div>

    <div class="social-buttons">
      <a href="#" class="social-btn whatsapp" id="whatsappBtn">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
      <a href="#" class="social-btn call" id="callBtn">
        <i class="fas fa-phone"></i> Appeler
      </a>
      <a href="#" class="social-btn tiktok" id="tiktokBtn">
        <i class="fab fa-tiktok"></i> TikTok
      </a>
    </div>

    <div class="email-display">
      <div class="email-label">📧 Email principal</div>
      <div class="email-value">gagneavecia@gmail.com</div>
    </div>
  </div>

  <!-- ===== ADMIN ACCESS ===== -->
  <div class="card" style="text-align:center;border-color:rgba(184,134,11,0.04);">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">
      <i class="fas fa-lock" style="color:var(--accent);"></i> Accès administrateur
    </div>
    <div style="font-size:13px;color:var(--text-dim);">
      <span style="color:var(--text-light);font-weight:500;">admin@arvexa.com</span>
    </div>
  </div>

</main>

<!-- ================================================================ -->
<!-- CONFIGURATION CENTRALISÉE -->
<!-- ================================================================ -->
<script src="config.js"></script>

<script>
// ================================================================
// CONFIGURATION
// ================================================================
var WHATSAPP_NUMBER = '22798064667';
var TIKTOK_URL = 'https://tiktok.com/@arvexa_officiel';
var ADMIN_EMAIL = 'gagneavecia@gmail.com';

if (typeof APP_CONFIG !== 'undefined') {
  if (APP_CONFIG.CONTACT_WHATSAPP) WHATSAPP_NUMBER = APP_CONFIG.CONTACT_WHATSAPP;
  if (APP_CONFIG.ADMIN_EMAIL) ADMIN_EMAIL = APP_CONFIG.ADMIN_EMAIL;
  if (APP_CONFIG.SOCIAL && APP_CONFIG.SOCIAL.TIKTOK) TIKTOK_URL = APP_CONFIG.SOCIAL.TIKTOK;
}

console.debug('📱 WhatsApp:', WHATSAPP_NUMBER);
console.debug('🎵 TikTok:', TIKTOK_URL);
console.debug('📧 Admin:', ADMIN_EMAIL);

// ================================================================
// BOUTONS
// ================================================================
document.getElementById('whatsappBtn').href = 'https://wa.me/' + WHATSAPP_NUMBER;
document.getElementById('callBtn').href = 'tel:+' + WHATSAPP_NUMBER;
document.getElementById('tiktokBtn').href = TIKTOK_URL;

// ================================================================
// AUTH
// ================================================================
var isPageLoading = true;

onAuthStateChanged(auth, function(user) {
  if (user) {
    localStorage.setItem('ARVEXA_current_user', user.uid);
    isPageLoading = false;
  } else {
    if (isPageLoading) {
      setTimeout(function() {
        if (!auth.currentUser) {
          var savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          }
        }
      }, 3000);
    } else {
      var savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(function() {
          if (!auth.currentUser) {
            window.location.href = 'login.html';
          }
        }, 2000);
      }
    }
  }
});

console.debug('ℹ️ ARVEXA - Page À Propos (version simple)');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA - Boutique produits digitaux">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #8A3A3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --glass-bg: rgba(26, 58, 42, 0.15);
      --glass-border: rgba(184, 134, 11, 0.04);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --whatsapp: #25D366;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }

    @keyframes pageFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.10) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
      pointer-events: none;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.08); top: 40%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5%;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent); font-style: italic; }

    .back-btn {
      width: clamp(32px, 4vw, 40px);
      height: clamp(32px, 4vw, 40px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:active { transform: scale(0.94); background: rgba(184, 134, 11, 0.08); }
    .back-btn i { font-size: clamp(14px, 1.8vw, 18px); }

    .header-placeholder {
      width: clamp(32px, 4vw, 40px);
      flex-shrink: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 5% 40px;
      width: 100%;
    }

    /* ===== SKELETON ===== */
    .skeleton {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      animation: skeletonPulse 1.2s ease-in-out infinite;
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .skeleton-text { height: 14px; width: 100%; margin-bottom: 6px; border-radius: 4px; }
    .skeleton-text.w60 { width: 60%; }
    .skeleton-text.w40 { width: 40%; }
    .skeleton-text.w30 { width: 30%; }

    /* ===== HERO ===== */
    .hero {
      background: linear-gradient(135deg, rgba(26, 58, 42, 0.20), rgba(10, 26, 18, 0.10));
      border-radius: var(--radius);
      padding: 28px 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(184, 134, 11, 0.10);
      text-align: center;
    }
    .hero-icon { font-size: 40px; color: var(--accent); margin-bottom: 10px; display: block; }
    .hero h1 { font-size: 24px; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--text-light); }
    .hero h1 span { color: var(--accent); font-style: italic; }
    .hero p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

    /* ===== FILTRES ===== */
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      align-items: center;
    }
    .filters-bar .search-input {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      background: rgba(10, 10, 10, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .filters-bar .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.08);
    }
    .filters-bar .search-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(10, 10, 10, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }
    .filter-btn:active { transform: scale(0.96); }
    .filter-btn:hover {
      border-color: rgba(184, 134, 11, 0.15);
      color: var(--text-light);
    }
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(184, 134, 11, 0.06);
    }
    .filter-btn i { font-size: 14px; }

    .filter-btn.category-btn {
      background: rgba(184, 134, 11, 0.04);
      border-color: rgba(184, 134, 11, 0.08);
      color: var(--accent);
    }
    .filter-btn.category-btn:hover {
      background: rgba(184, 134, 11, 0.08);
    }

    /* ============================================================
       CARTE PRODUIT - AMÉLIORÉE
       ============================================================ */
    .card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      animation: fadeInUp 0.4s ease forwards;
    }
    .card:hover {
      border-color: rgba(184, 134, 11, 0.10);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card .card-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--bg-dark);
    }
    .card .card-content {
      padding: 14px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card .card-category {
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .card .card-title {
      font-size: 15px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--text-light);
      line-height: 1.3;
      margin-bottom: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .card-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
      margin-bottom: 8px;
    }
    .card .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.03);
      flex-wrap: wrap;
      gap: 4px;
    }
    .card .card-price {
      font-size: 16px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--success);
    }
    .card .card-seller {
      font-size: 12px;
      color: var(--text-muted);
    }
    .card .card-seller i { color: var(--accent); margin-right: 4px; }

    /* ✅ BOUTONS CENTRÉS */
    .card .card-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .card .card-actions .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
    }
    .card .card-actions .btn-contact:active { transform: scale(0.95); }
    .card .card-actions .btn-contact.whatsapp {
      background: var(--whatsapp);
      color: #fff;
    }
    .card .card-actions .btn-contact.whatsapp:hover { background: #1DA851; }
    .card .card-actions .btn-contact.call {
      background: var(--accent);
      color: var(--bg-dark);
    }
    .card .card-actions .btn-contact.call:hover { background: #9A7209; }

    /* ===== SKELETON CARD ===== */
    .skeleton-card {
      background: rgba(255,255,255,0.02);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.02);
      animation: skeletonPulse 1.5s ease-in-out infinite;
    }
    .skeleton-card .skeleton-image {
      aspect-ratio: 16/9;
      background: rgba(255,255,255,0.03);
    }
    .skeleton-card .skeleton-content {
      padding: 14px 16px 16px;
    }
    .skeleton-card .skeleton-line {
      height: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .skeleton-card .skeleton-line:last-child { margin-bottom: 0; }
    .skeleton-card .skeleton-line.w60 { width: 60%; }
    .skeleton-card .skeleton-line.w40 { width: 40%; }
    .skeleton-card .skeleton-line.w30 { width: 30%; }

    /* ===== PRODUCTS GRID ===== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 4px;
    }

    /* ============================================================
       MODALE PRODUIT
       ============================================================ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 3, 5, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 20px;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: linear-gradient(145deg, #141414 0%, #0A0A0A 100%);
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      transform: scale(0.92) translateY(20px);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--success), var(--accent), transparent);
      background-size: 200% 100%;
      animation: shimmerGold 3s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes shimmerGold {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .modal-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(184, 134, 11, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .modal-header .modal-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-header .modal-title span {
      color: var(--accent);
      font-style: italic;
    }
    .modal-header .modal-title i {
      color: var(--accent);
      font-size: 20px;
    }
    .modal-close-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: rgba(184, 134, 11, 0.04);
      border: 1px solid rgba(184, 134, 11, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 14px;
      flex-shrink: 0;
    }
    .modal-close-btn:hover {
      background: rgba(184, 134, 11, 0.08);
      border-color: rgba(184, 134, 11, 0.12);
      color: var(--text-light);
    }
    .modal-close-btn:active { transform: scale(0.92); }

    .modal-body {
      padding: 16px 20px 20px;
      max-height: 60vh;
      overflow-y: auto;
    }
    .modal-body::-webkit-scrollbar { width: 3px; }
    .modal-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; opacity: 0.3; }

    .modal-body .modal-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      background: var(--bg-dark);
    }
    .modal-body .modal-category {
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-body .modal-title-text {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--text-light);
      margin: 2px 0 6px;
    }
    .modal-body .modal-desc {
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .modal-body .modal-footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 12px;
    }
    .modal-body .modal-price {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--success);
    }
    .modal-body .modal-seller {
      font-size: 13px;
      color: var(--text-muted);
    }
    .modal-body .modal-seller i { color: var(--accent); margin-right: 4px; }

    .modal-body .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .modal-body .modal-actions .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      border: none;
      cursor: pointer;
      flex: 1;
    }
    .modal-body .modal-actions .btn-contact:active { transform: scale(0.95); }
    .modal-body .modal-actions .btn-contact.whatsapp {
      background: var(--whatsapp);
      color: #fff;
    }
    .modal-body .modal-actions .btn-contact.whatsapp:hover { background: #1DA851; }
    .modal-body .modal-actions .btn-contact.call {
      background: var(--accent);
      color: var(--bg-dark);
    }
    .modal-body .modal-actions .btn-contact.call:hover { background: #9A7209; }
    
        /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      max-width: 90%;
      width: 400px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #0D2A1F; border: 1px solid #2D7D5A; color: #2D7D5A; }
    .toast.error { background: #2A0D0D; border: 1px solid #8A3A3A; color: #8A3A3A; }
    .toast.warning { background: #2A1A0D; border: 1px solid #B8860B; color: #B8860B; }
    .toast.info { background: #0D1A2A; border: 1px solid #4A7A8A; color: #4A7A8A; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .products-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .container { padding: 12px 4% 30px; }
      .hero h1 { font-size: 20px; }
      .filters-bar { flex-direction: column; align-items: stretch; }
      .filters-bar .search-input { min-width: auto; }
      .filter-btn { justify-content: center; }
      .card .card-content { padding: 10px 12px 12px; }
      .card .card-title { font-size: 13px; }
      .card .card-desc { font-size: 10px; display: none; }
      .card .card-price { font-size: 14px; }
      .card .card-actions .btn-contact { font-size: 10px; padding: 4px 10px; }
      .card .card-actions .btn-contact i { font-size: 10px; }
      .modal-content { max-width: 100%; margin: 10px; border-radius: 16px; }
      .modal-body .modal-title-text { font-size: 17px; }
      .modal-body .modal-desc { font-size: 13px; }
      .modal-body .modal-actions { flex-direction: column; }
      .modal-body .modal-actions .btn-contact { flex: 1; }
    }

    @media (min-width: 601px) and (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .filters-bar { flex-wrap: wrap; }
    }

    @media (min-width: 769px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    }

    @media (min-width: 1024px) {
      .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
  <a href="index.html" class="logo">ARVE<span>XA</span></a>
  <span class="header-placeholder"></span>
</header>

<main class="container">

  <!-- ===== HERO ===== -->
  <div class="hero">
    <span class="hero-icon"><i class="fas fa-store"></i></span>
    <h1>🛒 Boutique <span>ARVEXA</span></h1>
    <p>Découvrez les produits digitaux de la communauté</p>
  </div>

  <!-- ===== FILTRES ===== -->
  <div class="filters-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Rechercher un produit...">

function getCachedUserDataBoutique() {
  try {
    const cached = localStorage.getItem('ARVEXA_user_data');
    const timestamp = localStorage.getItem('ARVEXA_user_data_timestamp');
    if (!cached) return null;
    if (timestamp) {
      const age = Date.now() - parseInt(timestamp);
      if (age > 300000) return null;
    }
    return JSON.parse(cached);
  } catch(e) { return null; }
}

function setCachedUserDataBoutique(data) {
  localStorage.setItem('ARVEXA_user_data', JSON.stringify(data));
  localStorage.setItem('ARVEXA_user_data_timestamp', String(Date.now()));
}

function loadFromCacheBoutique() {
  const cached = getCachedUserDataBoutique();
  if (cached) {
    return true;
  }
  return false;
}

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'info') {
  toast.textContent = message;
  toast.className = 'toast ' + type;
  clearTimeout(notificationTimeout);
  requestAnimationFrame(() => toast.classList.add('show'));
  notificationTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ================================================================
// FORMAT CURRENCY
// ================================================================
function formatCurrency(amount) {
  if (!amount) return '0 FCFA';
  return amount.toLocaleString('fr-FR') + ' FCFA';
}

// ================================================================
// ESCAPE HTML
// ================================================================
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ================================================================
// RENDRE LES PRODUITS (CARTES AMÉLIORÉES)
// ================================================================
function renderProducts(products) {
  if (!products || products.length === 0) {
    productsGrid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-dim);">

        <p style="font-size:13px;opacity:0.6;margin-top:4px;">Soyez le premier à publier un produit !</p>
      </div>
    `;
    return;
  }

  let html = '';
  products.forEach((product, index) => {
    const categoryIcon = CATEGORIES.find(c => c.id === product.category)?.icon || 'fa-tag';
    const categoryLabel = CATEGORIES.find(c => c.id === product.category)?.label || product.category || 'Général';
    
    const sellerName = product.userName || 'Vendeur';
    const sellerWhatsApp = product.userWhatsApp || '';
    const price = product.price || 0;
    const title = product.title || 'Sans titre';
    const description = product.description || '';
    const image = product.coverImage || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27225%27%3E%3Crect fill=%27%231A3A2A%27 width=%27400%27 height=%27225%27/%3E%3Ctext x=%27200%27 y=%27120%27 text-anchor=%27middle%27 font-size=%2740%27 fill=%27%23B8860B%27%3E📦%3C/text%3E%3C/svg%3E';

    const cleanWhatsapp = sellerWhatsApp.replace(/\s/g, '');
    const whatsappLink = cleanWhatsapp ? `https://wa.me/${cleanWhatsapp.replace('+', '')}?text=Bonjour%2C%20je%20suis%20int%C3%A9ress%C3%A9%20par%20votre%20produit%20%22${encodeURIComponent(title)}%22` : '#';
    const callLink = cleanWhatsapp ? `tel:${cleanWhatsapp.replace('+', '')}` : '#';

    html += `
      <div class="card" data-product='${JSON.stringify(product).replace(/'/g, "&#39;")}' style="animation-delay: ${index * 0.05}s;">
        <img src="${image}" alt="${escapeHtml(title)}" class="card-image" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27225%27%3E%3Crect fill=%27%231A3A2A%27 width=%27400%27 height=%27225%27/%3E%3Ctext x=%27200%27 y=%27120%27 text-anchor=%27middle%27 font-size=%2740%27 fill=%27%23B8860B%27%3E📦%3C/text%3E%3C/svg%3E'">
        <div class="card-content">
          <div class="card-category"><i class="fas ${categoryIcon}"></i> ${escapeHtml(categoryLabel)}</div>
          <div class="card-title">${escapeHtml(title)}</div>
          <div class="card-desc">${escapeHtml(description)}</div>
          <div class="card-footer">
            <span class="card-price">${formatCurrency(price)}</span>
            <span class="card-seller"><i class="fas fa-user"></i> ${escapeHtml(sellerName)}</span>
          </div>
          <div class="card-actions">
            ${sellerWhatsApp ? `
              <a href="${whatsappLink}" target="_blank" class="btn-contact whatsapp">
                <i class="fab fa-whatsapp"></i> WhatsApp
              </a>
              <a href="${callLink}" class="btn-contact call">
                <i class="fas fa-phone"></i> Appel
              </a>
            ` : `
              <span style="font-size:11px;color:var(--text-muted);">📱 Aucun contact</span>
            `}
          </div>
        </div>
      </div>
    `;
  });

  productsGrid.innerHTML = html;

  // ✅ Écouteur de clic sur les cartes → Ouvre la modale
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', function() {
      const productData = this.dataset.product;
      if (productData) {
        try {
          const product = JSON.parse(productData);
          openProductModal(product);
        } catch(e) {
          console.error('Erreur parsing produit:', e);
        }
      }
    });
  });
}

// ================================================================
// OUVRIRE LA MODALE PRODUIT
// ================================================================
function openProductModal(product) {
  const categoryIcon = CATEGORIES.find(c => c.id === product.category)?.icon || 'fa-tag';
  const categoryLabel = CATEGORIES.find(c => c.id === product.category)?.label || product.category || 'Général';
  
  const sellerName = product.userName || 'Vendeur';
  const sellerWhatsApp = product.userWhatsApp || '';
  const price = product.price || 0;
  const title = product.title || 'Sans titre';
  const description = product.description || 'Aucune description disponible.';
  const image = product.coverImage || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27225%27%3E%3Crect fill=%27%231A3A2A%27 width=%27400%27 height=%27225%27/%3E%3Ctext x=%27200%27 y=%27120%27 text-anchor=%27middle%27 font-size=%2740%27 fill=%27%23B8860B%27%3E📦%3C/text%3E%3C/svg%3E';

  const cleanWhatsapp = sellerWhatsApp.replace(/\s/g, '');
  const whatsappLink = cleanWhatsapp ? `https://wa.me/${cleanWhatsapp.replace('+', '')}?text=Bonjour%2C%20je%20suis%20int%C3%A9ress%C3%A9%20par%20votre%20produit%20%22${encodeURIComponent(title)}%22` : '#';
  const callLink = cleanWhatsapp ? `tel:${cleanWhatsapp.replace('+', '')}` : '#';

  productModalBody.innerHTML = `
    <img src="${image}" alt="${escapeHtml(title)}" class="modal-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27400%27 height=%27225%27%3E%3Crect fill=%27%231A3A2A%27 width=%27400%27 height=%27225%27/%3E%3Ctext x=%27200%27 y=%27120%27 text-anchor=%27middle%27 font-size=%2740%27 fill=%27%23B8860B%27%3E📦%3C/text%3E%3C/svg%3E'">
    <div class="modal-category"><i class="fas ${categoryIcon}"></i> ${escapeHtml(categoryLabel)}</div>
    <div class="modal-title-text">${escapeHtml(title)}</div>
    <div class="modal-desc">${escapeHtml(description)}</div>
    <div class="modal-footer-info">
      <span class="modal-price">${formatCurrency(price)}</span>
      <span class="modal-seller"><i class="fas fa-user"></i> ${escapeHtml(sellerName)}</span>
    </div>
    <div class="modal-actions">
      ${sellerWhatsApp ? `
        <a href="${whatsappLink}" target="_blank" class="btn-contact whatsapp">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="${callLink}" class="btn-contact call">
          <i class="fas fa-phone"></i> Appel
        </a>
      ` : `
        <span style="font-size:13px;color:var(--text-muted);text-align:center;width:100%;">📱 Aucun contact disponible</span>
      `}
    </div>
  `;

  productModal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeProductModalFn() {
  productModal.classList.remove('show');
  document.body.style.overflow = '';
}

closeProductModal.addEventListener('click', closeProductModalFn);
productModal.addEventListener('click', (e) => {
  if (e.target === productModal) closeProductModalFn();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeProductModalFn();
});

// ================================================================
// FILTRER LES PRODUITS
// ================================================================
function filterProducts() {
  const searchTerm = searchInput.value.toLowerCase().trim();
  
  filteredProducts = allProducts.filter(product => {
    if (selectedCategory !== 'all' && product.category !== selectedCategory) {
      return false;
    }
    if (!product.userWhatsApp) {
      return false;
    }
    if (searchTerm) {
      const title = (product.title || '').toLowerCase();
      const desc = (product.description || '').toLowerCase();
      const seller = (product.userName || '').toLowerCase();
      if (!title.includes(searchTerm) && !desc.includes(searchTerm) && !seller.includes(searchTerm)) {
        return false;
      }
    }
    return true;
  });

  renderProducts(filteredProducts);
}

// ================================================================
// CHARGER LES PRODUITS DEPUIS FIRESTORE
// ================================================================
function loadProducts() {
  if (unsubscribeProducts) {
    unsubscribeProducts();
    unsubscribeProducts = null;
  }

  productsGrid.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    productsGrid.innerHTML += `
      <div class="skeleton-card">
        <div class="skeleton-image"></div>
        <div class="skeleton-content">
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w40"></div>
          <div class="skeleton-line w30"></div>
        </div>
      </div>
    `;
  }

  const q = query(
    collection(db, 'produits'),
    where('status', '==', 'active')
  );

  unsubscribeProducts = onSnapshot(q, (snapshot) => {
    allProducts = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      if (data.userWhatsApp) {
        allProducts.push({
          id: doc.id,
          ...data
        });
      }
    });

    allProducts.sort((a, b) => {
      const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
      const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
      return dateB - dateA;
    });

    filterProducts();

  }, (error) => {
    console.error('Erreur chargement produits:', error);
    productsGrid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-dim);">
        <i class="fas fa-exclamation-circle" style="font-size:40px;opacity:0.2;display:block;margin-bottom:12px;"></i>
        <p>Erreur de chargement</p>
        <p style="font-size:13px;opacity:0.6;margin-top:4px;">Veuillez réessayer plus tard</p>
      </div>
    `;
  });
}

// ================================================================
// GESTION DE LA MODALE CATÉGORIES
// ================================================================
function renderCategories() {
  let html = '';
  CATEGORIES.forEach(cat => {
    const selected = cat.id === selectedCategory ? 'selected' : '';
    html += `
      <div class="category-option ${selected}" data-category="${cat.id}" style="padding:12px;border:1px solid ${cat.id === selectedCategory ? 'var(--accent)' : 'rgba(184,134,11,0.08)'};border-radius:12px;cursor:pointer;text-align:center;background:${cat.id === selectedCategory ? 'rgba(184,134,11,0.10)' : 'rgba(10,10,10,0.4)'};">
        <i class="fas ${cat.icon}" style="font-size:20px;color:var(--accent);display:block;margin-bottom:4px;"></i>
        <span style="font-size:13px;color:var(--text-light);font-weight:500;">${cat.label}</span>
      </div>
    `;
  });
  categoryGrid.innerHTML = html;

  document.querySelectorAll('.category-option').forEach(opt => {
    opt.addEventListener('click', function() {
      const category = this.dataset.category;
      const label = CATEGORIES.find(c => c.id === category)?.label || 'Catégorie';
      
      selectedCategory = category;
      categoryLabel.textContent = label;
      
      document.querySelectorAll('.category-option').forEach(o => {
        o.style.borderColor = 'rgba(184,134,11,0.08)';
        o.style.background = 'rgba(10,10,10,0.4)';
      });
      this.style.borderColor = 'var(--accent)';
      this.style.background = 'rgba(184,134,11,0.10)';
      
      closeCategoryModalFn();
      filterProducts();
    });
  });
}

function openCategoryModal() {
  categoryModal.classList.add('show');
}

function closeCategoryModalFn() {
  categoryModal.classList.remove('show');
}

categoryBtn.addEventListener('click', openCategoryModal);
closeCategoryModal.addEventListener('click', closeCategoryModalFn);
categoryModal.addEventListener('click', (e) => {
  if (e.target === categoryModal) closeCategoryModalFn();
});

// ================================================================
// ÉVÉNEMENTS
// ================================================================
searchInput.addEventListener('input', filterProducts);

// ================================================================
// CACHE POUR RETOUR ARRIÈRE INSTANTANÉ
// ================================================================
window.addEventListener('pageshow', function(event) {
  if (event.persisted) {
    console.debug('📱 Page boutique chargée depuis le cache');
    loadFromCacheBoutique();
    loadProducts();
  }
});

// ================================================================
// AUTH
// ================================================================
let sessionUid = sessionStorage.getItem('session_uid');

loadFromCacheBoutique();

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    localStorage.setItem('ARVEXA_current_user', user.uid);
    
    if (sessionUid === user.uid) {
      console.debug("✅ Session déjà validée, chargement rapide");
      renderCategories();
      loadProducts();
      isPageLoading = false;
      return;
    }

    renderCategories();
    loadProducts();
    isPageLoading = false;
  } else {
    if (isPageLoading) {
      setTimeout(() => {
        if (!auth.currentUser) {
          const savedUid = localStorage.getItem('ARVEXA_current_user');
          if (savedUid) {
            if (!auth.currentUser) {
              window.location.href = 'login.html';
            }
          } else {
            window.location.href = 'login.html';
          }
        }
      }, 3000);
    } else {
      const savedUid = localStorage.getItem('ARVEXA_current_user');
      if (savedUid) {
        setTimeout(() => {
          if (!auth.currentUser) {
            window.location.href = 'login.html';
          }
        }, 2000);
      } else {
        window.location.href = 'login.html';
      }

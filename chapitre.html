<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>ARVEXA - Chapitre</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --bg-dark: #0A0A0A;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --success: #2D7D5A;
      --danger: #8A3A3A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26,58,42,0.10) 0%, transparent 70%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 5%;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(184,134,11,0.04);
    }

    .back-btn {
      width: 34px; height: 34px;
      background: rgba(26,58,42,0.15);
      border: 1px solid rgba(184,134,11,0.04);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.2s;
      font-size: 14px;
    }
    .back-btn:hover { border-color: rgba(184,134,11,0.12); color: var(--text-light); }
    .back-btn:active { transform: scale(0.92); }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      flex: 1;
    }
    .header-title span { color: var(--accent); font-style: italic; }
    
    .header-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }
    .header-badge.cours {
      background: rgba(184, 134, 11, 0.12);
      color: var(--accent);
      border: 1px solid rgba(184, 134, 11, 0.15);
    }
    .header-badge.exercices {
      background: rgba(45, 125, 90, 0.12);
      color: var(--success);
      border: 1px solid rgba(45, 125, 90, 0.15);
    }
    .header-badge.correction {
      background: rgba(138, 58, 58, 0.12);
      color: var(--danger);
      border: 1px solid rgba(138, 58, 58, 0.15);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 5%;
    }

    .chapter-content {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      min-height: 300px;
    }

    .chapter-content .chapter-title {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .chapter-content .chapter-title span {
      color: var(--accent);
      font-style: italic;
    }
    .chapter-content .chapter-meta {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    /* ===== BIENTÔT ===== */
    .coming-soon {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .coming-soon .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .coming-soon h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    .coming-soon p {
      font-size: 15px;
      line-height: 1.8;
      max-width: 400px;
      margin: 0 auto;
      color: var(--text-dim);
    }

    .pulse-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .pulse-dots .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseDot 1.5s ease-in-out infinite;
    }
    .pulse-dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dots .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .btn-back {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 28px;
      background: var(--accent);
      color: var(--bg-dark);
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #9A7209; }

    @media (max-width: 480px) {
      .chapter-content { padding: 16px; }
      .chapter-content .chapter-title { font-size: 20px; }
      .header-title { font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="gradient-bg"></div>

<header class="header">
  <a href="#" class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></a>
  <div class="header-title" id="headerTitle">📖 <span>Chapitre</span></div>
  <span class="header-badge" id="headerBadge">📖 Cours</span>
</header>

<main class="container">
  <div class="chapter-content" id="chapterContent">
    <!-- Rempli par JavaScript -->
  </div>
</main>

<script>
  // ================================================================
  // CHARGER LE CHAPITRE
  // ================================================================
  document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const matiere = params.get('matiere') || 'maths';
    const chapitre = params.get('chapitre') || '1';
    const type = params.get('type') || 'cours'; // cours, exercices, correction

    // Noms des matières
    const matiereNames = {
      'maths': 'Mathématiques',
      'physique': 'Physique',
      'chimie': 'Chimie',
      'svt': 'SVT',
      'francais': 'Français',
      'bac-sujets': 'Sujets BAC'
    };

    // Noms des types
    const typeNames = {
      'cours': 'Cours',
      'exercices': 'Exercices',
      'correction': 'Correction'
    };

    // Icônes des types
    const typeIcons = {
      'cours': '📖',
      'exercices': '✏️',
      'correction': '✅'
    };

    // Classes des badges
    const typeClasses = {
      'cours': 'cours',
      'exercices': 'exercices',
      'correction': 'correction'
    };

    const matiereName = matiereNames[matiere] || matiere;
    const typeName = typeNames[type] || 'Cours';
    const typeIcon = typeIcons[type] || '📖';
    const typeClass = typeClasses[type] || 'cours';

    // Mise à jour du titre
    document.getElementById('headerTitle').innerHTML = typeIcon + ' <span>Chapitre ' + chapitre + '</span>';
    document.getElementById('headerBadge').textContent = typeName;
    document.getElementById('headerBadge').className = 'header-badge ' + typeClass;

    // Bouton retour
    document.getElementById('backBtn').href = 'matiere.html?id=' + matiere + '&filiere=bac';

    // Déterminer le fichier à charger
    let fileName = '';
    if (type === 'cours') {
      fileName = 'chapitre_' + chapitre + '.html';
    } else if (type === 'exercices') {
      fileName = 'exercices_' + chapitre + '.html';
    } else if (type === 'correction') {
      fileName = 'correction_' + chapitre + '.html';
    }

    const filePath = 'chapitres/bac/' + matiere + '/' + fileName;
    
    // Afficher le chargement
    document.getElementById('chapterContent').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--text-muted);">
        <i class="fas fa-spinner fa-spin" style="font-size:32px;"></i>
        <p style="margin-top:12px;">Chargement...</p>
      </div>
    `;

    fetch(filePath)
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Fichier non trouvé');
        }
        return response.text();
      })
      .then(function(html) {
        // ✅ LE FICHIER EXISTE → AFFICHER LE CONTENU
        document.getElementById('chapterContent').innerHTML = html;
      })
      .catch(function() {
        // ❌ LE FICHIER N'EXISTE PAS → AFFICHER "BIENTÔT DISPONIBLE"
        document.getElementById('chapterContent').innerHTML = `
          <div class="coming-soon">
            <div class="icon">📚</div>
            <h2>${typeName} en préparation</h2>
            <p>Le ${typeName.toLowerCase()} du chapitre ${chapitre} de ${matiereName} arrive très bientôt !</p>
            <div class="pulse-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <a href="matiere.html?id=${matiere}&filiere=bac" class="btn-back">
              <i class="fas fa-arrow-left"></i> Retour aux chapitres
            </a>
          </div>
        `;
      });
  });
</script>
</body>
</html>

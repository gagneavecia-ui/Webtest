name: Deploy ARVEXA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check for exposed secrets
        run: |
          echo "🔍 Vérification des secrets exposés..."
          ! grep -r "AIzaSy" . --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git --exclude="config.js"
          ! grep -r "sk-or-v1-" . --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git
          ! grep -r "gsk_" . --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git
          echo "✅ Aucun secret exposé trouvé"

  deploy-firebase:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy Firestore Rules and Indexes
        run: |
          firebase deploy --only firestore:rules --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only firestore:indexes --token ${{ secrets.FIREBASE_TOKEN }}

  deploy-vercel:
    needs: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Create config.js from secrets
        run: |
          echo "// Auto-generated config - DO NOT EDIT" > config.js
          echo "const APP_CONFIG = {" >> config.js
          echo "  FIREBASE: {" >> config.js
          echo "    apiKey: '${{ secrets.FIREBASE_API_KEY }}'," >> config.js
          echo "    authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> config.js
          echo "    projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'," >> config.js
          echo "    storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> config.js
          echo "    messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> config.js
          echo "    appId: '${{ secrets.FIREBASE_APP_ID }}'," >> config.js
          echo "    measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}'" >> config.js
          echo "  }," >> config.js
          echo "  CONTACT_WHATSAPP: '${{ secrets.CONTACT_WHATSAPP }}'," >> config.js
          echo "  ADMIN_EMAIL: '${{ secrets.ADMIN_EMAIL }}'," >> config.js
          echo "  MIN_DEPOSIT: 3000," >> config.js
          echo "  MAX_DEPOSIT: 1000000," >> config.js
          echo "  MIN_WITHDRAWAL: 1000," >> config.js
          echo "  MAX_WITHDRAWAL: 50000," >> config.js
          echo "  API_KEYS: {" >> config.js
          echo "    MISTRAL: '${{ secrets.MISTRAL_API_KEY }}'," >> config.js
          echo "    GROQ: '${{ secrets.GROQ_API_KEY }}'," >> config.js
          echo "    OPENROUTER: '${{ secrets.OPENROUTER_API_KEY }}'" >> config.js
          echo "  }," >> config.js
          echo "  TELEGRAM: {" >> config.js
          echo "    BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'," >> config.js
          echo "    CHAT_ID: '${{ secrets.TELEGRAM_CHAT_ID }}'" >> config.js
          echo "  }" >> config.js
          echo "};" >> config.js
          echo "export default APP_CONFIG;" >> config.js
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'